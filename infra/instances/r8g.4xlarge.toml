# Rekall benchmark instance: r8g.4xlarge (Graviton4, 16 vCPU, 128 GiB RAM).
#
# The Graviton4 counterpart of r8i.4xlarge — identical vCPU/RAM
# shape — for Intel-vs-ARM comparisons on the same workloads.
#
# Launch with:
#   rekall infra up -c infra/instances/r8g.4xlarge.toml
#
# Role in the size ladder: the small box. Two uses:
#   - In-memory HNSW builds for ~10M datasets: the auto maintenance_work_mem
#     (~51 GiB) comfortably holds a cohere-10M m24 graph (~39 GiB), so the
#     build stays single-pass in RAM.
#   - The downsize/query target for out-of-RAM HNSW benchmarks. A cohere-50M
#     m24 index (~195 GiB) does NOT fit in 128 GiB RAM, so queries exercise
#     the index-doesn't-fit-in-RAM path. Build the index on a 16xlarge, then
#     `rekall infra resize -c infra/instances/r8g.4xlarge.toml --name <box>`
#     to drop down for the query run (the EBS volume + index are preserved).
# Do NOT build a 50M index here: the graph (~195 GiB) far exceeds the ~51 GiB
# maintenance_work_mem, so the build spills to the slow on-disk path.
#
# This file is the canonical, committed config for this instance type.
# Personal/machine-specific overrides go in `r8g.4xlarge.local.toml`
# (same directory, gitignored): ssh_key, iam_instance_profile, s3_bucket,
# and the meerkat git_url/git_ref. See `local.toml.example`.

# ----- Provider & region -------------------------------------------------

provider = "aws"
region   = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "r8g.4xlarge"

# r8i is EBS-only (no instance store), so give the root volume enough space
# for the dataset + indexes + WAL, and max out gp3 IOPS/throughput so load
# and build aren't I/O bound. Sized for ~10M workloads. NOTE: when this
# config is used as a `resize` downsize target the volume is inherited from
# the source instance and this value is ignored — it only applies to a fresh
# `infra up`. Raise it if you launch a 4xlarge fresh against a larger dataset.
disk_size_gb    = 300
disk_iops       = 16000
disk_throughput = 1000

name_prefix = "rekall-r8g4"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18
# pg_port  = 5432

# Only the extensions this box benchmarks (pgvector HNSW vs Meerkat).
extensions = ["pgvector", "meerkat"]

# PG GUC overrides — merged over the auto-computed defaults. Only the values
# that deliberately differ are listed; the rest are derived from the instance
# type (16 vCPU / 128 GiB): shared_buffers = 32GB, effective_cache_size =
# 96GB, maintenance_work_mem = 2·RAM/5 = 51GB (holds a ~10M HNSW graph, not a
# 50M one), and max_parallel_maintenance_workers = 8 (physical cores). Run
# `rekall infra show -c infra/instances/r8g.4xlarge.toml` for the full
# effective config. All values must be strings.
[pg_config]
# Larger search-phase working memory than the 256MB default.
work_mem = "1GB"

# Bigger WAL ceiling → fewer checkpoints during a bulk load.
max_wal_size = "32GB"

# This box's gp3 volume is provisioned for high IOPS; raise the prefetch
# depth above the default 200.
effective_io_concurrency = "256"
maintenance_io_concurrency = "256"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

# ----- Private-repo builds (set git_url in .local.toml) ----------------

# Meerkat is a private repo. Put the URL and ref in .local.toml:
#   [meerkat]
#   git_url = "git@github.com:timescale/meerkat.git"
#   git_ref = "feat/parallel-build-pg-on-foundation"

# ----- Required local-only fields (set in .local.toml) -----------------

# ssh_key              = "~/.ssh/id_ed25519.pub"   # REQUIRED
# iam_instance_profile = "rekall-profile"          # REQUIRED
# s3_bucket            = "my-datasets-bucket"      # scopes IAM template
