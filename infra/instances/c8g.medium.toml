# Rekall benchmark instance: c8g.medium (Graviton4, 1 vCPU, 2 GiB RAM).
#
# The floor rung of the cohere-1M small-instance ladder — the smallest
# non-burstable EC2 instance
# worth benchmarking on. (t4g.small is also 2 GiB but is burstable; its CPU
# credit accounting makes QPS numbers meaningless.)
#
# Do not provision from scratch here: provision.sh compiles pg_vectorsearch (and
# optionally rekall) from source and 2 GiB is not enough headroom. Resize
# into it instead — `rekall infra resize -c infra/instances/c8g.medium.toml`
# brings the EBS volume and both built indexes along.
#
# PRISM builds fine at this size (its k-means sample buffer is bounded by
# maintenance_work_mem and it subsamples rather than failing). pgvector HNSW
# does not: the ~2.05 GB graph exceeds anything 2 GiB of RAM can hand to
# maintenance_work_mem, even with shared_buffers collapsed for the build
# phase, so it can only complete via the on-disk spill pass. That asymmetry
# is what this rung demonstrates.
#
# What this rung tests: 2 GiB holds PRISM's ~0.28 GB index with room to
# spare, and holds essentially none of HNSW's ~1.9-2.0 GB halfvec graph (m=16
# and m=24 are within ~2% of each other at 768d). If PRISM serves cohere-1M
# at a usable QPS here and HNSW does not, this is the instance size that
# proves it.
#
# Note that the 1 vCPU breaks the ladder's constant-core-count property —
# compare it to the other rungs on per-query latency and I/O counters
# (search.io_stats), not on raw QPS.
#
# Personal overrides go in `c8g.medium.local.toml` (gitignored).

# ----- Provider & region -------------------------------------------------

provider     = "aws"
region       = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "c8g.medium"

# Instance-store NVMe is not an option here: `rekall infra resize` stops and
# starts the instance, and instance-store volumes are wiped by a stop, so
# PGDATA has to be on EBS for the built indexes to survive the walk down the
# ladder. (The run records what the storage actually was, so a box that
# silently landed elsewhere shows up on the results page.)
# gp3 at its included baseline: 3000 IOPS / 125 MiB/s, no provisioned
# extra. Held constant across every rung.
#
# This is a deliberate reversal. These configs asked for 16000/1000 on the
# theory that under-provisioning storage would replace the memory effect
# rather than reveal it. Two things overturned that:
#
#   1. Provisioning it costs ~$108/mo for 100 GB -- more than any instance
#      on this ladder ($37-$74). The comparison is "cheapest box that hits
#      the target", so storage nobody would actually buy would dominate the
#      very number being measured. A real deployment on a $66/mo box runs
#      gp3 defaults, and the baseline is included in the per-GB price, so
#      there is nothing cheaper to drop to.
#
#   2. It does not distort the measurement anyway, as long as the runs are
#      warm. The 8 GiB rung recorded zero disk reads on every sweep point
#      once its cache settled -- the volume never entered the measurement.
#      Storage only starts to matter at the rung where the working set stops
#      fitting, and there its effect is part of the answer rather than noise.
#
# If you want the provisioned-IOPS variant, make it a separate arm of the
# frontier rather than a constant -- it is a different price point, not a
# better-controlled version of this one.
disk_size_gb = 100

name_prefix = "rekall-1m-ladder"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18

extensions = ["pgvector", "pg_vectorsearch"]

# The auto-tuner derives shared_buffers as RAM/4 in whole GB, which is
# 0GB at 2 GiB of RAM — PostgreSQL will not start with that. Every memory
# GUC is therefore set explicitly here.
#
# 512MB of shared_buffers is chosen so PRISM's ~0.28 GB index fits inside
# it outright; the remaining ~1.4 GiB is left to the OS page cache and the
# backends. maintenance_work_mem is kept small on purpose: it bounds
# PRISM's k-means sample buffer (a palloc'd
# maintenance_work_mem/(4*dim)-vector array), so a large value would OOM the
# box if someone does try to build here. PRISM degrades by subsampling and
# recovers with its page-backed refine pass; it has no build-memory cliff.
[pg_config]
shared_buffers       = "512MB"
effective_cache_size = "1500MB"
maintenance_work_mem = "384MB"
work_mem             = "16MB"
max_wal_size         = "4GB"
min_wal_size         = "512MB"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

