# Rekall benchmark instance: r8i.16xlarge (Intel, 64 vCPU, 512 GiB RAM).
#
# Launch with:
#   rekall infra up -c infra/instances/r8i.16xlarge.toml
#
# The build sweet spot for 10M datasets: index-build parallelism is capped
# at 32 workers (HNSW build scaling is sublinear past that), and a 64-vCPU
# Intel box has 32 physical cores — so it gets the *same* 32 build workers
# as the 24xlarge, building at essentially the same speed for ~2/3 the cost.
# 512 GiB is ample: a cohere-10M HNSW graph is ~45 GiB and the auto
# maintenance_work_mem is 256 GiB, so the whole graph stays in RAM (no
# on-disk second pass).
#
# This file is the canonical, committed config for this instance type.
# Personal/machine-specific overrides go in `r8i.16xlarge.local.toml`
# (same directory, gitignored): ssh_key, iam_instance_profile, s3_bucket,
# and the meerkat git_url/git_ref. See `local.toml.example`.

# ----- Provider & region -------------------------------------------------

provider = "aws"
region   = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "r8i.16xlarge"

# r8i is EBS-only (no instance store), so give the root volume enough
# space for the dataset + indexes + WAL, and max out gp3 IOPS/throughput
# so load and build aren't I/O bound. Sized for cohere-50M, where the HDF5
# file (~155 GB), the heap (~155 GB), and the pgvector HNSW graph (~165 GB,
# which stores the vectors) dominate, plus the HNSW-bq and Meerkat indexes
# (~30 GB combined — Meerkat reranks from the heap, so its index is small)
# and WAL. That's ~600 GB of working set; 1000 GB leaves headroom for WAL
# spikes during the big HNSW build and temp/sort space.
disk_size_gb    = 1000
disk_iops       = 16000
disk_throughput = 1000

name_prefix = "rekall-r8i16"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18
# pg_port  = 5432

# Only the extensions this box benchmarks (pgvector HNSW vs Meerkat).
extensions = ["pgvector", "meerkat"]

# PG GUC overrides — merged over the auto-computed defaults. Only the
# values that deliberately differ from the defaults are listed here;
# everything else is derived from the instance type (64 vCPU / 512 GiB):
# shared_buffers = 128GB, effective_cache_size = 384GB,
# maintenance_work_mem = RAM/2 = 256GB (≫ a cohere-10M graph ~45GB), and
# max_parallel_maintenance_workers = 32 (vCPU/2, at the sublinear-scaling
# cap). Run `rekall infra show -c infra/instances/r8i.16xlarge.toml` for
# the full effective config. All values must be strings.
[pg_config]
# Larger search-phase working memory than the 256MB default.
work_mem = "1GB"

# Bigger WAL ceiling → far fewer checkpoints during a big bulk load.
max_wal_size = "64GB"

# This box's gp3 volume is provisioned for high IOPS; raise the prefetch
# depth above the default 200.
effective_io_concurrency = "256"
maintenance_io_concurrency = "256"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

# ----- Private-repo builds (set git_url in .local.toml) ----------------

# Meerkat is a private repo. Put the URL and ref in .local.toml:
#   [meerkat]
#   git_url = "git@github.com:timescale/meerkat.git"
#   git_ref = "feat/parallel-build-pg-on-foundation"

# ----- Required local-only fields (set in .local.toml) -----------------

# ssh_key              = "~/.ssh/id_ed25519.pub"   # REQUIRED
# iam_instance_profile = "rekall-profile"          # REQUIRED
# s3_bucket            = "my-datasets-bucket"      # scopes IAM template
