# Rekall benchmark instance: m8g.large (Graviton4, 2 vCPU, 8 GiB RAM).
#
# TOP RUNG and BUILD BOX of the cohere-1M cost comparison (see
# benchmarks/cohere-1m-sizing.md). Launch here, load, build both engines'
# indexes, measure, then `rekall infra resize` down to c8g.large (4 GiB)
# and c8g.medium (2 GiB).
#
# 8 GiB is the entry point because it is the smallest rung whose stock
# maintenance_work_mem (2*RAM/5 = 3 GB) already exceeds the ~2.05 GB HNSW
# halfvec graph: HNSW builds in memory, in parallel, with no per-phase
# retuning, so the artifact every rung then measures is HNSW's best graph.
#
# 8 GiB is also the interesting boundary for serving:
#
#   - PRISM's index (~0.28 GB) plus the ~4.1 GB heap it reranks against
#     both fit in RAM. Everything is warm.
#   - HNSW m24 halfvec's graph (~2.0 GB) fits in RAM, but graph + heap
#     (~6.1 GB) does not fit alongside PG's own memory. Queries stay fast
#     (the halfvec is *in* the graph, so an unfiltered top-k scan barely
#     touches the heap) — this is the last rung where HNSW is comfortable.
#   - maintenance_work_mem auto-computes to 3 GB, still above the graph, so
#     HNSW also *builds* here without spilling and without any per-phase
#     retuning. 8 GiB is the HNSW build floor under stock auto-tuning; with
#     the build phase's shared_buffers traded for maintenance_work_mem it
#     drops to 4 GiB (benchmarks/cohere-1m-build-floor.toml).
#
# Same 2 vCPU and same 100 GB gp3 as the other ladder rungs, so
# `rekall infra resize` between them changes RAM and nothing else.
#
# Launch fresh:
#   rekall infra up -c infra/instances/m8g.large.toml
# Or downsize an existing ladder box (keeps the volume and built indexes):
#   rekall infra resize -c infra/instances/m8g.large.toml
#
# Personal overrides go in `m8g.large.local.toml` (gitignored).

# ----- Provider & region -------------------------------------------------

provider     = "aws"
region       = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "m8g.large"

# Instance-store NVMe is not an option here: `rekall infra resize` stops and
# starts the instance, and instance-store volumes are wiped by a stop, so
# PGDATA has to be on EBS for the built indexes to survive the walk down the
# ladder. (The run records what the storage actually was, so a box that
# silently landed elsewhere shows up on the results page.)
# gp3 at its included baseline: 3000 IOPS / 125 MiB/s, no provisioned
# extra. Held constant across every rung.
#
# This is a deliberate reversal. These configs asked for 16000/1000 on the
# theory that under-provisioning storage would replace the memory effect
# rather than reveal it. Two things overturned that:
#
#   1. Provisioning it costs ~$108/mo for 100 GB -- more than any instance
#      on this ladder ($37-$74). The comparison is "cheapest box that hits
#      the target", so storage nobody would actually buy would dominate the
#      very number being measured. A real deployment on a $66/mo box runs
#      gp3 defaults, and the baseline is included in the per-GB price, so
#      there is nothing cheaper to drop to.
#
#   2. It does not distort the measurement anyway, as long as the runs are
#      warm. The 8 GiB rung recorded zero disk reads on every sweep point
#      once its cache settled -- the volume never entered the measurement.
#      Storage only starts to matter at the rung where the working set stops
#      fitting, and there its effect is part of the answer rather than noise.
#
# If you want the provisioned-IOPS variant, make it a separate arm of the
# frontier rather than a constant -- it is a different price point, not a
# better-controlled version of this one.
disk_size_gb = 100

name_prefix = "rekall-1m-ladder"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18

extensions = ["pgvector", "pg_vectorsearch"]

# Auto-computed for 8 GiB: shared_buffers 2GB, maintenance_work_mem 3GB,
# effective_cache_size 6GB. Left alone — 3 GB of maintenance_work_mem is
# what makes this the smallest in-memory HNSW build.
[pg_config]
work_mem = "64MB"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

