# Rekall benchmark instance: r8i.2xlarge (Intel, 8 vCPU, 64 GiB RAM).
#
# Launch with:
#   rekall infra up -c infra/instances/r8i.2xlarge.toml
#
# Sized for cohere-5M: a full-precision HNSW graph for 5M × 768d is ~18-20
# GiB, which won't fit in maintenance_work_mem on a 32 GiB m8i.2xlarge
# (it would spill to pgvector's slow on-disk pass). The r8i's 64 GiB lets
# maintenance_work_mem hold the whole graph in RAM for a fast build.
#
# This file is the canonical, committed config for this instance type.
# Personal/machine-specific overrides go in `r8i.2xlarge.local.toml`
# (same directory, gitignored): ssh_key, iam_instance_profile, s3_bucket,
# and the meerkat git_url/git_ref. See `local.toml.example`.

# ----- Provider & region -------------------------------------------------

provider = "aws"
region   = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "r8i.2xlarge"

# r8i is EBS-only. cohere-5M peaks around ~110 GiB (dataset file + heap +
# all indexes + WAL); 250 GiB leaves comfortable headroom. Max out gp3
# IOPS/throughput so load and build aren't I/O bound.
disk_size_gb    = 250
disk_iops       = 16000
disk_throughput = 1000

name_prefix = "rekall-r8i2x"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18
# pg_port  = 5432

# Only the extensions this box benchmarks (pgvector HNSW vs Meerkat).
extensions = ["pgvector", "meerkat"]

# PG GUC overrides — merged over the auto-computed defaults. Only the
# values that deliberately differ from the defaults are listed here;
# everything else (shared_buffers = RAM/4, maintenance_work_mem = RAM/2,
# the SMT-aware parallel-worker counts, etc.) is derived from the instance
# type. Run `rekall infra show -c infra/instances/r8i.2xlarge.toml` to see
# the full effective config. All values must be strings.
[pg_config]
# Larger search-phase working memory than the 256MB default.
work_mem = "512MB"

# Bigger WAL ceiling → fewer checkpoints during the bulk load.
max_wal_size = "32GB"

# This box's gp3 volume is provisioned for high IOPS; raise the prefetch
# depth above the default 200.
effective_io_concurrency = "256"
maintenance_io_concurrency = "256"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

# ----- Private-repo builds (set git_url in .local.toml) ----------------

# Meerkat is a private repo. Put the URL and ref in .local.toml:
#   [meerkat]
#   git_url = "git@github.com:timescale/meerkat.git"
#   git_ref = "feat/parallel-build-pg-on-foundation"

# ----- Required local-only fields (set in .local.toml) -----------------

# ssh_key              = "~/.ssh/id_ed25519.pub"   # REQUIRED
# iam_instance_profile = "rekall-profile"          # REQUIRED
# s3_bucket            = "my-datasets-bucket"      # scopes IAM template
