# Rekall benchmark instance: r8i.24xlarge (Intel, 96 vCPU, 768 GiB RAM).
#
# Launch with:
#   rekall infra up -c infra/instances/r8i.24xlarge.toml
#
# Big memory-optimized box sized for 10M+ datasets and fast parallel
# index builds. The PG tuning below is build-heavy: a large
# maintenance_work_mem keeps the whole pgvector HNSW graph in RAM (no
# on-disk second pass), and max_parallel_maintenance_workers lets both
# HNSW and Meerkat builds fan out across the 96 vCPUs.
#
# This file is the canonical, committed config for this instance type.
# Personal/machine-specific overrides go in `r8i.24xlarge.local.toml`
# (same directory, gitignored): ssh_key, iam_instance_profile, s3_bucket,
# and the meerkat git_url/git_ref. See `local.toml.example`.

# ----- Provider & region -------------------------------------------------

provider = "aws"
region   = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "r8i.24xlarge"

# r8i is EBS-only (no instance store), so give the root volume enough
# space for the dataset + indexes + WAL, and max out gp3 IOPS/throughput
# so load and build aren't I/O bound.
disk_size_gb    = 600
disk_iops       = 16000
disk_throughput = 1000

name_prefix = "rekall-r8i24"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18
# pg_port  = 5432

# Only the extensions this box benchmarks (pgvector HNSW vs Meerkat).
extensions = ["pgvector", "meerkat"]

# PG GUC overrides — merged over the auto-computed defaults. Tuned for
# 768 GiB and parallel index builds.
[pg_config]
# 25% of RAM for the buffer cache; the rest of RAM stays free for the
# OS page cache and the transient maintenance_work_mem below.
shared_buffers = "192GB"
effective_cache_size = "576GB"

# Crucial for HNSW build speed: keep the entire graph in memory so
# pgvector never falls back to its slower on-disk second pass. 256 GiB
# is far above a cohere-10M graph (~35 GiB) yet safely below RAM even
# alongside shared_buffers, leaving headroom for larger datasets. It is
# a ceiling (allocated on demand), and the build is one operation at a
# time, so it does not multiply across parallel workers.
maintenance_work_mem = "256GB"

# Index-build parallelism. pgvector's HNSW build uses this value DIRECTLY
# as its worker count (it calls plan_create_index_workers only as a
# yes/no gate, then returns max_parallel_maintenance_workers) — so 32
# here launches 32 workers. Meerkat uses the standard AM path and is
# heap-size-derated, so on big tables raise the table's parallel_workers
# reloption to push it past the planner's estimate.
#
# 32 is ~1/3 of the 96 vCPUs and stays under the 48 physical cores, so
# builds don't oversubscribe cores or thrash memory bandwidth. HNSW build
# scaling is sublinear — workers share one in-memory graph with locking,
# so going much higher buys little and risks contention; sweep {16,32,48}
# on the box for the empirical knee. max_parallel_workers and
# max_worker_processes must exceed this or fewer workers actually launch.
max_parallel_maintenance_workers = 32
max_parallel_workers = 64
max_worker_processes = 96
max_parallel_workers_per_gather = 16

# Per-query working memory for the search phase.
work_mem = "1GB"

# Fewer checkpoints during bulk load + build.
max_wal_size = "64GB"
min_wal_size = "2GB"
checkpoint_completion_target = 0.9

# gp3-class SSD concurrency.
effective_io_concurrency = 256
maintenance_io_concurrency = 256

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

# ----- Private-repo builds (set git_url in .local.toml) ----------------

# Meerkat is a private repo. Put the URL and ref in .local.toml:
#   [meerkat]
#   git_url = "git@github.com:timescale/meerkat.git"
#   git_ref = "feat/parallel-build-pg-on-foundation"

# ----- Required local-only fields (set in .local.toml) -----------------

# ssh_key              = "~/.ssh/id_ed25519.pub"   # REQUIRED
# iam_instance_profile = "rekall-profile"          # REQUIRED
# s3_bucket            = "my-datasets-bucket"      # scopes IAM template
