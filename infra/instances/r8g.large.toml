# Rekall benchmark instance: r8g.large (Graviton4, 2 vCPU, 16 GiB RAM).
#
# OPTIONAL full-fidelity reference box for cohere-1M. NOT a rung of the
# cost comparison -- that ladder is m8g.large (8 GiB) / c8g.large (4 GiB) /
# c8g.medium (2 GiB), and 16 GiB cannot be the cheapest answer to a cost
# question if 8 GiB already clears the target.
#
# Use this when you want headroom rather than a floor: everything cached for
# both engines, stock maintenance_work_mem of 6 GB, no contention with the
# question being asked. See benchmarks/cohere-1m-sizing.md.
#
# Launch with:
#   rekall infra up -c infra/instances/r8g.large.toml
#
# Personal/machine-specific overrides go in `r8g.large.local.toml`
# (same directory, gitignored). See `local.toml.example`.

# ----- Provider & region -------------------------------------------------

provider     = "aws"
region       = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "r8g.large"

# Held constant across the whole ladder so RAM is the only variable, and
# provisioned to the gp3 maximum (16000 IOPS / 1000 MiB/s) on purpose.
#
# That is a correction of an earlier choice to leave it at the gp3 defaults
# "so as not to mask the memory effect". Under-provisioning storage does not
# reveal the memory effect, it replaces it: Meerkat reranks 160 random heap
# pages per query, so an uncached heap needs ~65 reads/query at the 4 GiB
# rung and ~124 at 2 GiB. At 3000 IOPS that alone caps the box at ~46 and
# ~24 QPS -- the ladder would be measuring the volume, not the box's RAM.
# Maxing IOPS keeps RAM the binding constraint, which is the point.
#
# Instance-store NVMe would be better still, but it is incompatible with
# this workflow: `rekall infra resize` stops and starts the instance, and
# instance-store volumes are wiped by a stop. PGDATA has to be on EBS for
# the built indexes to survive the walk down the ladder.
#
# Disk budget: cohere-1M hdf5 (~3.1 GB) + heap (~4.1 GB) + two HNSW
# halfvec graphs (~2.0 GB each) + meerkat (~0.3 GB) + max_wal_size + the
# OS/PG install. 100 GB fits with room to spare.
disk_size_gb    = 100
disk_iops       = 16000
disk_throughput = 1000

name_prefix = "rekall-1m-ladder"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18

# Only what this comparison needs — source builds are slow on 2 vCPU.
extensions = ["pgvector", "meerkat"]

# Auto-computed for 16 GiB: shared_buffers 4GB, maintenance_work_mem 6GB,
# effective_cache_size 12GB. 6 GB of maintenance_work_mem comfortably holds
# the ~1.9 GiB HNSW graph (and stays under the /dev/shm 50%-of-RAM ceiling
# that pgvector's parallel build allocates its DSM segment from). Nothing to
# override.
[pg_config]
# 2 vCPU: the auto value (256MB) is a large slice of 16 GiB once a few
# backends are active.
work_mem = "128MB"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

# ----- Private-repo builds (set git_url in .local.toml) ----------------

#   [meerkat]
#   git_url = "git@github.com:timescale/meerkat.git"
#   git_ref = "main"

