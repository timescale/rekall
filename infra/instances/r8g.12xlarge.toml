# Rekall benchmark instance: r8g.12xlarge (Graviton4, 48 vCPU, 384 GiB RAM).
#
# The Graviton4 counterpart of r8i.12xlarge — identical vCPU/RAM
# shape — for Intel-vs-ARM comparisons on the same workloads.
#
# Launch with:
#   rekall infra up -c infra/instances/r8g.12xlarge.toml
#
# Comfortable for 10M datasets with large memory headroom — a cohere-10M
# HNSW graph is ~45 GiB and the auto maintenance_work_mem is 192 GiB, so
# the whole graph stays in RAM. Unlike the Intel counterpart, Graviton
# has no SMT — all 48 vCPUs are physical cores — so the auto worker
# count already hits the 32-worker build cap; there is no build-
# parallelism trade-off vs the larger boxes.
#
# This file is the canonical, committed config for this instance type.
# Personal/machine-specific overrides go in `r8g.12xlarge.local.toml`
# (same directory, gitignored): ssh_key, iam_instance_profile, s3_bucket,
# and the pg_vectorsearch git_url/git_ref. See `local.toml.example`.

# ----- Provider & region -------------------------------------------------

provider = "aws"
region   = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "r8g.12xlarge"

# r8i is EBS-only (no instance store), so give the root volume enough
# space for the dataset + indexes + WAL, and max out gp3 IOPS/throughput
# so load and build aren't I/O bound.
disk_size_gb    = 600
disk_iops       = 16000
disk_throughput = 1000

name_prefix = "rekall-r8g12"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18
# pg_port  = 5432

# Only the extensions this box benchmarks (pgvector HNSW vs PRISM).
extensions = ["pgvector", "pg_vectorsearch"]

# PG GUC overrides — merged over the auto-computed defaults. Only the
# values that deliberately differ from the defaults are listed here;
# everything else is derived from the instance type (48 vCPU / 384 GiB):
# shared_buffers = 96GB, effective_cache_size = 288GB,
# maintenance_work_mem = 2·RAM/5 = 153GB (≫ a cohere-10M graph ~45GB), and
# max_parallel_maintenance_workers = 24 (vCPU/2, below the 32 cap). Run
# `rekall infra show -c infra/instances/r8g.12xlarge.toml` for the full
# effective config. All values must be strings.
[pg_config]
# Larger search-phase working memory than the 256MB default.
work_mem = "1GB"

# Bigger WAL ceiling → far fewer checkpoints during a big bulk load.
max_wal_size = "64GB"

# This box's gp3 volume is provisioned for high IOPS; raise the prefetch
# depth above the default 200.
effective_io_concurrency = "256"
maintenance_io_concurrency = "256"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

# ----- Private-repo builds (set git_url in .local.toml) ----------------

# PRISM is a private repo. Put the URL and ref in .local.toml:
#   [pg_vectorsearch]
#   git_url = "git@github.com:timescale/pg_vectorsearch.git"
#   git_ref = "feat/parallel-build-pg-on-foundation"

# ----- Required local-only fields (set in .local.toml) -----------------

# ssh_key              = "~/.ssh/id_ed25519.pub"   # REQUIRED
# iam_instance_profile = "rekall-profile"          # REQUIRED
# s3_bucket            = "my-datasets-bucket"      # scopes IAM template
