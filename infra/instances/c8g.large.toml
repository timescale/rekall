# Rekall benchmark instance: c8g.large (Graviton4, 2 vCPU, 4 GiB RAM).
#
# Rung 3 of the cohere-1M small-instance ladder. This is the rung where
# the two engines are expected to separate:
#
#   - PRISM's index is ~0.28 GB. It fits in shared_buffers with room left
#     over; only the exact-rerank heap fetches (auto rerank_pool = 16*k =
#     160 tuples/query) miss cache. Those are INDEPENDENT random reads, so
#     PG can issue them concurrently (effective_io_concurrency 200).
#   - HNSW m24 halfvec's graph is ~2.0 GB against 1 GB of shared_buffers and
#     ~4 GiB total RAM. The graph no longer stays resident, and an HNSW walk
#     is a chain of DEPENDENT random reads — each hop's target is only known
#     after the previous hop is read, so nothing can be prefetched and the
#     latency is serialized. Dropping to m=16 does not rescue it: at 768d
#     the halfvec payload dominates an HNSW node, so the m16 graph is only
#     ~2% smaller (~1.9 GB).
#   - maintenance_work_mem auto-computes to 1 GB, below the graph, so an
#     HNSW build under the stock config falls into pgvector's on-disk pass.
#     For the query ladder, build on r8g.large and `rekall infra resize`
#     down instead.
#
#     That is a tuning artifact rather than a real floor, though: HNSW
#     can build here *in memory* by collapsing shared_buffers to 128MB for
#     the build phase, pushing maintenance_work_mem to 2560MB, and forcing
#     the build serial so the graph lands in backend-local memory instead
#     of a /dev/shm-capped DSM segment.
#
# Same 2 vCPU and same 100 GB gp3 as the other ladder rungs.
#
#   rekall infra resize -c infra/instances/c8g.large.toml
#
# Personal overrides go in `c8g.large.local.toml` (gitignored).

# ----- Provider & region -------------------------------------------------

provider     = "aws"
region       = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "c8g.large"

# Instance-store NVMe is not an option here: `rekall infra resize` stops and
# starts the instance, and instance-store volumes are wiped by a stop, so
# PGDATA has to be on EBS for the built indexes to survive the walk down the
# ladder. (The run records what the storage actually was, so a box that
# silently landed elsewhere shows up on the results page.)
# gp3 at its included baseline: 3000 IOPS / 125 MiB/s, no provisioned
# extra. Held constant across every rung.
#
# This is a deliberate reversal. These configs asked for 16000/1000 on the
# theory that under-provisioning storage would replace the memory effect
# rather than reveal it. Two things overturned that:
#
#   1. Provisioning it costs ~$108/mo for 100 GB -- more than any instance
#      on this ladder ($37-$74). The comparison is "cheapest box that hits
#      the target", so storage nobody would actually buy would dominate the
#      very number being measured. A real deployment on a $66/mo box runs
#      gp3 defaults, and the baseline is included in the per-GB price, so
#      there is nothing cheaper to drop to.
#
#   2. It does not distort the measurement anyway, as long as the runs are
#      warm. The 8 GiB rung recorded zero disk reads on every sweep point
#      once its cache settled -- the volume never entered the measurement.
#      Storage only starts to matter at the rung where the working set stops
#      fitting, and there its effect is part of the answer rather than noise.
#
# If you want the provisioned-IOPS variant, make it a separate arm of the
# frontier rather than a constant -- it is a different price point, not a
# better-controlled version of this one.
disk_size_gb = 100

name_prefix = "rekall-1m-ladder"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18

extensions = ["pgvector", "pg_vectorsearch"]

# Auto-computed for 4 GiB: shared_buffers 1GB, maintenance_work_mem 1GB,
# effective_cache_size 3GB. work_mem's auto value (256MB) is far too large a
# slice of 4 GiB once several backends sort concurrently.
[pg_config]
work_mem = "32MB"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

