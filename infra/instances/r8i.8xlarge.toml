# Rekall benchmark instance: r8i.8xlarge (Intel, 32 vCPU, 256 GiB RAM).
#
# Launch with:
#   rekall infra up -c infra/instances/r8i.8xlarge.toml
#
# Role in the size ladder: the mid box. Uses:
#   - In-memory HNSW builds for ~20M datasets: the auto maintenance_work_mem
#     (~102 GiB) holds a cohere-20M m24 graph (~78 GiB), so the build stays
#     single-pass in RAM.
#   - A query box that holds a cohere-50M m24 index (~195 GiB) fully in 256
#     GiB RAM. As an out-of-RAM downsize target it's for ~80M+ indexes
#     (which exceed 256 GiB); build those on a 16/24xlarge, then
#     `rekall infra resize -c infra/instances/r8i.8xlarge.toml --name <box>`.
#
# This file is the canonical, committed config for this instance type.
# Personal/machine-specific overrides go in `r8i.8xlarge.local.toml`
# (same directory, gitignored): ssh_key, iam_instance_profile, s3_bucket,
# and the pg_vectorsearch git_url/git_ref. See `local.toml.example`.

# ----- Provider & region -------------------------------------------------

provider = "aws"
region   = "us-east-1"

# ----- Instance ----------------------------------------------------------

instance_type = "r8i.8xlarge"

# r8i is EBS-only (no instance store), so give the root volume enough space
# for the dataset + indexes + WAL, and max out gp3 IOPS/throughput so load
# and build aren't I/O bound. Sized for ~20M workloads. NOTE: when this
# config is used as a `resize` downsize target the volume is inherited from
# the source instance and this value is ignored — it only applies to a fresh
# `infra up`. Raise it if you launch an 8xlarge fresh against a larger dataset.
disk_size_gb    = 500
disk_iops       = 16000
disk_throughput = 1000

name_prefix = "rekall-r8i8"

# ----- OS image ----------------------------------------------------------

# ubuntu_version = "24.04"

# ----- PostgreSQL --------------------------------------------------------

pg_version = 18
# pg_port  = 5432

# Only the extensions this box benchmarks (pgvector HNSW vs PRISM).
extensions = ["pgvector", "pg_vectorsearch"]

# PG GUC overrides — merged over the auto-computed defaults. Only the values
# that deliberately differ are listed; the rest are derived from the instance
# type (32 vCPU / 256 GiB): shared_buffers = 64GB, effective_cache_size =
# 192GB, maintenance_work_mem = 2·RAM/5 = 102GB (holds a ~20M HNSW graph),
# and max_parallel_maintenance_workers = 16 (physical cores). Run
# `rekall infra show -c infra/instances/r8i.8xlarge.toml` for the full
# effective config. All values must be strings.
[pg_config]
# Larger search-phase working memory than the 256MB default.
work_mem = "1GB"

# Bigger WAL ceiling → fewer checkpoints during a bulk load.
max_wal_size = "32GB"

# This box's gp3 volume is provisioned for high IOPS; raise the prefetch
# depth above the default 200.
effective_io_concurrency = "256"
maintenance_io_concurrency = "256"

# ----- Extension version pins -------------------------------------------

[pgvector]
version = "v0.8.2"

# ----- Private-repo builds (set git_url in .local.toml) ----------------

# PRISM is a private repo. Put the URL and ref in .local.toml:
#   [pg_vectorsearch]
#   git_url = "git@github.com:timescale/pg_vectorsearch.git"
#   git_ref = "feat/parallel-build-pg-on-foundation"

# ----- Required local-only fields (set in .local.toml) -----------------

# ssh_key              = "~/.ssh/id_ed25519.pub"   # REQUIRED
# iam_instance_profile = "rekall-profile"          # REQUIRED
# s3_bucket            = "my-datasets-bucket"      # scopes IAM template
