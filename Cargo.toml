[workspace]
members = ["rekall-lib", "rekall"]
# Resolver 3 is MSRV-aware: it will not select a dependency version whose
# rust-version exceeds ours. Resolver 2 ignored rust-version entirely, so a
# plain `cargo update` happily pulled crates the pinned toolchain could not
# build (the aws-sdk family raising its MSRV to 1.94.1 against a 1.94.0 pin)
# and the failure only surfaced at compile time. Requires cargo 1.84+.
resolver = "3"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["derive"] }
deadpool-postgres = "0.14"
hdf5 = { package = "hdf5-metno", version = "0.12", features = ["f16"] }
ndarray = "0.17"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
hdrhistogram = "7"
dirs = "5"
tabled = "0.17"
async-trait = "0.1"
byteorder = "1"
bytes = "1"
futures-util = "0.3"
shellexpand = "3"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
flate2 = "1"
aws-config = "1"
aws-sdk-s3 = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Resolver 3 needs a declared MSRV to resolve against; without this it has
# nothing to compare dependency rust-versions to and degrades to resolver-2
# behaviour. Keep in sync with rust-toolchain.toml.
rust-version = "1.98"
