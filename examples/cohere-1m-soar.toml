[dataset]
name = "cohere-1m"
path = "data/cohere-wikipedia-22-12-1M-angular.hdf5"
metric = "angular"
dimension = 768

[connection]
dsn = "host=localhost port=5432 dbname=postgres"

[load]
table = "cohere_1m"

[[index]]
type = "meerkat"
name = "mkt-nlist-1000-soar"
[index.params]
nlist = 1000
fan_out = 32
centroid_compression = false
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16

[search]
k = 10
runs = 3
warmup = 500
num_queries = 2000

[[search.sweep]]
index = "mkt-nlist-1000-soar"
[search.sweep.params]
"mkt.nprobe" = [5, 10, 20, 40, 80]

[output]
format = ["table", "json"]
json_path = "results/cohere-1m-soar.json"
