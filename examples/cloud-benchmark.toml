# Cloud-based benchmark example.
#
# Usage:
#   1. Copy examples/cloud-benchmark.local.toml.example to
#      examples/cloud-benchmark.local.toml and fill in your SSH key path
#   2. rekall infra deploy-key -c examples/cloud-benchmark.toml
#   3. Add the printed public key to your GitHub repos (Settings → Deploy keys)
#   4. rekall infra up -c examples/cloud-benchmark.toml
#   5. SSH in and run benchmarks: rekall infra ssh -c examples/cloud-benchmark.toml
#   6. rekall infra down -c examples/cloud-benchmark.toml

[dataset]
name = "cohere-1m"
path = "data/cohere-wikipedia-22-12-1M-angular.hdf5"
metric = "angular"
dimension = 768

[connection]
dsn = "host=localhost port=5432 dbname=rekall user=rekall password=rekall"

[infra]
provider = "aws"
region = "us-east-1"
instance_type = "r7g.2xlarge"
disk_size_gb = 1000
pg_version = 18
extensions = ["pgvector", "meerkat"]
name_prefix = "rekall"

# PG settings are auto-computed from instance type (25% shared_buffers,
# 10% maintenance_work_mem, 75% effective_cache_size). Override here:
# [infra.pg_config]
# shared_buffers = "32GB"
# huge_pages = "try"

# Git URLs for private repos go in the .local.toml override.
# Public repos can be specified here with HTTPS URLs.
# [infra.rekall]
# git_url = "https://github.com/org/rekall.git"

# [infra.meerkat]
# git_url = "https://github.com/org/meerkat.git"

[load]
table = "cohere_1m"

[[index]]
type = "meerkat"
name = "mkt-n1000-fs16"
[index.params]
nlist = 1000
fastscan = true
[index.gucs]
"mkt.fastscan_bits" = 16

[[index]]
type = "pgvector-hnsw"
name = "hnsw-m16"
[index.params]
m = 16
ef_construction = 200

[search]
k = 10
runs = 3
warmup = 100

[[search.sweep]]
index = "mkt-n1000-fs16"
[search.sweep.params]
"mkt.nprobe" = [5, 10, 20, 40, 80]

[[search.sweep]]
index = "hnsw-m16"
[search.sweep.params]
"hnsw.ef_search" = [10, 20, 40, 80, 200, 400]

[output]
format = ["table", "json"]
results_dir = "results"
