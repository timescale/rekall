[dataset]
name = "cohere-1m"
path = "data/cohere-wikipedia-22-12-1M-angular.hdf5"
metric = "angular"
dimension = 768

[connection]
dsn = "host=localhost port=5432 dbname=postgres"

[load]
table = "cohere_1m"
parallelism = 1
chunk_size = 50000

[[index]]
type = "meerkat"
name = "mkt-nlist-1000"
[index.params]
nlist = 1000
fan_out = 32
centroid_compression = false
fastscan = true
[index.gucs]
"mkt.fastscan_bits" = 16

[[index]]
type = "pgvector-hnsw"
name = "hnsw-m16"
[index.params]
m = 16
ef_construction = 200

[search]
k = 10
runs = 3
warmup = 100

[[search.sweep]]
index = "mkt-nlist-1000"
[search.sweep.params]
"mkt.nprobe" = [5, 10, 20, 40, 80]

[[search.sweep]]
index = "hnsw-m16"
[search.sweep.params]
"hnsw.ef_search" = [10, 20, 40, 80, 200, 400]

[output]
format = ["table", "json"]
json_path = "results/cohere-1m-results.json"
