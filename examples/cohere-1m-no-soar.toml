[dataset]
name = "cohere-1m"
path = "~/ClaudeWorkspace/ann-benchmarks/data/cohere-wikipedia-22-12-1M-angular.hdf5"
metric = "angular"
dimension = 768

[connection]
dsn = "host=/home/enordstr/ClaudeWorkspace/pg/run/unix-sock port=5434 dbname=postgres"

[load]
table = "cohere_1m"

[[index]]
type = "meerkat"
name = "mkt-nlist-1000-nosoar"
[index.params]
nlist = 1000
fastscan = true

[search]
k = 10
runs = 3
warmup = 500
num_queries = 2000

[[search.sweep]]
index = "mkt-nlist-1000-nosoar"
[search.sweep.params]
"mkt.nprobe" = [5, 10, 20, 40, 80]

[output]
format = ["table", "json"]
json_path = "results/cohere-1m-no-soar.json"
