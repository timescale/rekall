# Suite: cohere-5m -- optimized PRISM vs pgvector HNSW.
#
# PRISM arms use the 50M-tuned configuration (centroid compression + FASTSCAN
# centroids + fastscan-16 + SOAR + boundary, error_scale=0, beam_scale=0.25).
# n16000 (~312 vecs/list) is the best 5M config measured so far; the sweep
# never went higher, so n20000 (~250 vecs/list) is included to test whether a
# finer list count is better -- the 50M optimum landed at ~208 vecs/list, so
# the 5M optimum may be above n16000. Lower nlists are omitted (known worse).
# Requires the feat/cohere-50m-perf branch.
#
# Usage: rekall run benchmarks/cohere-5m.toml [--dry-run]

indexes = [
    "indexes/mkt-n16000-cctrue-fs16-soar-cfs.toml",
    "indexes/mkt-n20000-cctrue-fs16-soar-cfs.toml",
    "indexes/hnsw-m24-halfvec.toml",
]

[[suite]]
dataset = "datasets/cohere-5m.toml"
