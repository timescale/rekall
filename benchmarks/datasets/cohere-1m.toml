[dataset]
name = "cohere-1m"
uri = "s3://vector-datasets/1M/cohere-wikipedia-22-12-1M-angular.hdf5"
metric = "angular"
dimension = 768

# Uncomment to override the global connection (from ~/.config/rekall/config.toml)
# [connection]
# dsn = "host=localhost port=5432 dbname=postgres"

[load]
table = "cohere_1m"
# The load pipeline buffers 4 chunks plus one in flight on the client;
# at the 50k default and 768d f32 that peaks near 1.5 GB, which OOMs the
# 2 GiB RAM-ladder rung (rekall runs on the instance next to PostgreSQL).
# 10k-row chunks cap the client at ~400 MB. Load is untimed, so the
# extra HDF5 reads cost nothing in the measurements.
chunk_size = 10000

[search]
k = 10
runs = 3
warmup = 500
num_queries = 10000

[output]
format = ["table", "json"]
results_dir = "results/cohere-1m"
