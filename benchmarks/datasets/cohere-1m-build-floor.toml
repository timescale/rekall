# Dataset: cohere-1M, configured for the HNSW build-floor experiment
# (see ../cohere-1m-sizing.md).
#
# Requires `[phase_pg_config]` (commit acc62b8, "phase-scoped PostgreSQL
# config with snapshot and restore"). Note that BenchmarkConfig does not
# deny unknown fields, so against a rekall that predates it the section is
# silently ignored and this degrades into an ordinary, badly-tuned build
# rather than erroring.
#
# The question this answers
# -------------------------
# Stock rekall auto-tuning ties maintenance_work_mem to the instance
# (2*RAM/5), so a ~2.05 GB HNSW halfvec graph appears to need an 8 GiB box
# to build in memory. But shared_buffers is dead weight during a build — the
# heap scan is sequential and the graph lives in maintenance_work_mem — so
# handing the build phase's shared_buffers to maintenance_work_mem instead
# should let a 4 GiB box build the same graph. This config does exactly that
# and is meant to be run on infra/instances/c8g.large.toml (2 vCPU, 4 GiB).
#
# Why the settings are what they are:
#
#   shared_buffers = "128MB"
#       Postmaster-context, so applying it restarts PostgreSQL and restores
#       it afterwards. A build does not need buffers; this frees ~900 MB on
#       the 4 GiB rung.
#
#   maintenance_work_mem = "2560MB"
#       The graph is ~2.05 GB on disk and pgvector's in-memory element
#       representation is somewhat larger, so this leaves headroom above the
#       on-disk size. If the build still logs "hnsw graph no longer fits into
#       maintenance_work_mem after N tuples", that log line IS the result:
#       raise it until the box refuses, and the value where it refuses is
#       the real floor.
#
#   max_parallel_maintenance_workers = "0"
#       This is the non-obvious one. pgvector's *parallel* HNSW build puts
#       the graph in a DSM segment, and DSM comes out of /dev/shm, which is
#       capped at 50% of RAM — 2 GiB on this box, below the 2560MB the graph
#       needs. A serial build keeps the graph in backend-local memory and
#       escapes that ceiling entirely. The price is build time: 2 vCPU of
#       parallelism is given up to make the build fit at all. That trade is
#       the finding, so the build_time_secs in the report matters as much as
#       whether it succeeded.
#
# The search phase is left alone deliberately — no override — so queries run
# at whatever shared_buffers the instance config gives the rung. Build
# sizing and query sizing are separate questions and this file only answers
# the first one.
#
# Usage (on c8g.large, or any rung you want to probe):
#   rekall index benchmarks/cohere-1m-build-floor.toml
# Repeat on m8g.large / c8g.medium to bracket the floor.

[dataset]
name = "cohere-1m"
uri = "s3://vector-datasets/1M/cohere-wikipedia-22-12-1M-angular.hdf5"
metric = "angular"
dimension = 768

[load]
table = "cohere_1m"

[phase_pg_config.index]
shared_buffers                   = "128MB"
maintenance_work_mem             = "2560MB"
max_parallel_maintenance_workers = "0"

[search]
k = 10
runs = 1
warmup = 200
num_queries = 1000
cache = "disk-cold"
io_stats = true

[output]
format = ["table", "json"]
results_dir = "results/cohere-1m-build-floor"
