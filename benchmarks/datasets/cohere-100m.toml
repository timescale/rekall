[dataset]
name = "cohere-100m"
uri = "s3://vector-datasets/100M/cohere-wikipedia-22-12-100M-angular.hdf5"
metric = "angular"
dimension = 768

# Uncomment to override the global connection (from ~/.config/rekall/config.toml)
# [connection]
# dsn = "host=localhost port=5432 dbname=postgres"

[load]
table = "cohere_100m"

[search]
k = 10
runs = 3
warmup = 500
num_queries = 10000

[output]
format = ["table", "json"]
results_dir = "results/cohere-100m"
