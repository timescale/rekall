# Dataset: cohere-1M, configured for the small-instance memory ladder
# (see ../cohere-1m-sizing.md).
#
# Same table as datasets/cohere-1m.toml (`cohere_1m`), so the indexes built
# once on the r8g.large build box are reused verbatim by every rung —
# `rekall search` resolves an arm to `idx_rekall_cohere_1m_<index-name>`,
# which does not depend on which dataset file named it.
#
# Differences from the standard cohere-1m dataset config:
#
#   cache = "disk-cold"
#       The whole question here is what happens when the index does not fit
#       in RAM, so the default `warm` mode is wrong twice over: it prewarms
#       shared buffers, and it blocks until the relation is resident in the
#       OS page cache — which on a 2 GiB box never happens for a 2 GB HNSW
#       graph. disk-cold drops the host page cache between sweep points so
#       each point starts from the same (empty) state instead of inheriting
#       whatever the previous arm left behind.
#
#   warmup = 1000 / num_queries = 1000
#       With a cold start, the first pass is what populates the cache. The
#       1000-query warmup lets it reach its steady state under memory
#       pressure; the timed queries then measure equilibrium, not first
#       touch. Query count is cut from 10000 because a thrashing HNSW walk
#       can drop to single-digit QPS and the full sweep would run for days.
#       1000 queries puts recall within about +/-1%.
#
#   io_stats = true (the default, set explicitly because it is the point)
#       The per-sweep-point read counters are the actual evidence: how many
#       blocks each engine has to pull off disk per query once its working
#       set stops fitting.

[dataset]
name = "cohere-1m"
uri = "s3://vector-datasets/1M/cohere-wikipedia-22-12-1M-angular.hdf5"
metric = "angular"
dimension = 768

[load]
table = "cohere_1m"

[search]
k = 10
runs = 2
warmup = 1000
num_queries = 1000
cache = "disk-cold"
io_stats = true

[output]
format = ["table", "json"]
results_dir = "results/cohere-1m-small"
