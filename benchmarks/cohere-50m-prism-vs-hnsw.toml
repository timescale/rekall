# Suite: cohere-50m -- optimized PRISM vs pgvector HNSW M=24.
#
# PRISM arms use the tuned configuration (centroid compression + FASTSCAN
# centroids + fastscan-16 + SOAR + boundary, error_scale=0, two-regime query
# GUCs) at the nlist sweet spot found during tuning: n240000 (~208 vecs/list)
# beat HNSW in the mid-recall band; coarser n120000 was worse and finer
# n480000 only tied, so both are dropped. The three arms sweep
# boundary_epsilon (0.15 / 0.25 / 0.35) to test whether a wider boundary
# replication band improves recall at this scale; eps 0.15 is the measured
# baseline. Wider eps replicates more vectors, so build time and index size
# grow with it.
#
# Build on the largest box: the n240k k-means sample buffer wants ~188 GB
# (nlist*256*dim*4, capped at maintenance_work_mem with subsampling on
# feature/build-memory-bounded); the full hnsw-m24 build on 50M is also a
# multi-hour long pole.
#
# Usage: rekall run benchmarks/cohere-50m-prism-vs-hnsw.toml [--dry-run]

indexes = [
    "indexes/prism-n240000-cctrue-fs16-soar-cfs-eps015.toml",
    "indexes/prism-n240000-cctrue-fs16-soar-cfs-eps025.toml",
    "indexes/prism-n240000-cctrue-fs16-soar-cfs-eps035.toml",
    "indexes/hnsw-m24-halfvec.toml",
]

[[suite]]
dataset = "datasets/cohere-50m.toml"
