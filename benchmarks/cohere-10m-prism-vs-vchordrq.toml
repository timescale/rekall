# PRISM vs VectorChord (vchordrq), cohere-10M -- the one VectorChord
# comparison suite. Uses each side at its best measured configuration:
# PRISM with all index parameters left to its auto settings (the
# prism-defaults arm), and VectorChord's plain residual-quantization
# build, which outperformed its rabitq8 and rabitq4-rerank variants by
# ~2x in the published 10M comparison (2026-06-16).
#
# Usage: rekall run benchmarks/cohere-10m-prism-vs-vchordrq.toml [--dry-run]

indexes = [
    "indexes/prism-defaults.toml",
    "indexes/vchordrq-n16000.toml",
]
[[suite]]
dataset = "datasets/cohere-10m.toml"
