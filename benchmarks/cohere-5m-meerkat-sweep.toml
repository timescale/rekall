# Suite: cohere-5m × meerkat nlist sweep.
# Compares nlist ∈ {2000, 4000, 8000, 16000} at otherwise-identical
# params (centroid compression on, fastscan-16, SOAR λ=1.0) to find
# the best partitioning size for ~5M cosine vectors. The IVF rule of
# thumb is ~4·√N (≈8944 for 5M), so 8000 should be near-optimal —
# this brackets it 4× either side.
#
# Usage: rekall run benchmarks/cohere-5m-meerkat-sweep.toml [--dry-run]

indexes = [
    "indexes/mkt-n2000-cctrue-fs16-soar.toml",
    "indexes/mkt-n4000-cctrue-fs16-soar.toml",
    "indexes/mkt-n8000-cctrue-fs16-soar.toml",
    "indexes/mkt-n16000-cctrue-fs16-soar.toml",
]

[[suite]]
dataset = "datasets/cohere-5m.toml"
