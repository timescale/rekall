# Suite: cohere-100m — out-of-the-box PRISM vs the tuned pgvector
# HNSW baseline, sized for the mid box (r8i.8xlarge: 32 vCPU, 256 GiB).
#
# Exactly two builds, to compare how the indexes build and then trade
# recall for throughput on the same hardware:
#
#   prism-defaults      built by a bare CREATE INDEX — no options, no
#                     pinned GUCs, auto nlist ≈ 390k (requires a
#                     pg_vectorsearch build with the tuned defaults). The
#                     search phase still sweeps nprobe for the full
#                     recall/QPS line; the nprobe=0 point on it is
#                     the shipped auto default
#   hnsw-m24-halfvec  the pg-aiguide-tuned baseline (m=24,
#                     ef_construction=200, halfvec expression index)
#
# The 256 GiB box makes the build comparison interesting: the auto
# maintenance_work_mem (~102 GiB) holds neither the ~190 GiB halfvec
# graph nor pg_vectorsearch's full k-means sample, so both builds exercise
# their memory-bounded paths.
#
# DISK: the committed r8i.8xlarge config provisions 500 GB (sized for
# ~20M). 100M needs ~2 TB (heap ~380 GB + halfvec graph ~190 GB +
# pg_vectorsearch ~30 GB + the ~300 GB dataset load and WAL) — override
# disk_size_gb in infra/instances/r8i.8xlarge.local.toml before a
# fresh `infra up`.
#
# Usage: rekall run benchmarks/cohere-100m-defaults-vs-hnsw.toml [--dry-run]

indexes = [
    "indexes/prism-defaults.toml",
    "indexes/hnsw-m24-halfvec.toml",
]

[[suite]]
dataset = "datasets/cohere-100m.toml"
