# Suite: cohere-1M -- cheapest Meerkat vs cheapest HNSW at equal performance.
#
# ONE suite, run at EVERY rung of the RAM ladder. There used to be a second
# "small-instance" suite for the lower rungs; it had the same three arms and
# differed only in its dataset config, which set cache = "disk-cold" while
# this one is warm. That made the rungs incomparable -- 8 GiB warm against
# 4 GiB disk-cold measures two different things -- so the two were collapsed
# into this file. Whatever settings a comparison needs, every rung must
# share them, and the cheapest way to guarantee that is one suite.
#
# Warm is the right policy here. The question is the least expensive box that
# still serves at a target recall and QPS, which is a steady-state serving
# question: a real server's cache holds whatever fits. Warm mode runs
# `warmup` queries before each sweep point, so the cache settles at the
# natural equilibrium for that box and working set -- exactly the variable
# the ladder is varying. Dropping caches per point instead prevents the box
# from using its RAM at all, which makes a big box and a small box look
# artificially alike (and silently skips the warmup entirely: see the
# `Skip warmup to measure cold-cache performance` branch in phase/search.rs).
#
# The build happens once, on the top rung, and every later rung reuses it --
# `rekall run` skips an index that already exists. Do NOT pass --rebuild:
# that would rebuild HNSW on the very boxes this experiment says cannot
# build it.
#
# Usage (from your WORKSTATION; infra run executes on the instance):
#
#   rekall infra up  -c infra/instances/m8g.large.toml
#   rekall infra load -c infra/instances/m8g.large.toml \
#       benchmarks/cohere-1m-mkt-vs-hnsw.toml          # load only
#
#   # Rung 1: builds the indexes AND measures them. Not in the loop below --
#   # `infra resize` to the type a box already is still stops, modifies and
#   # starts it, so looping from the first rung reboots the box between
#   # loading and building for no reason, and changes its public IP.
#   rekall infra run -c infra/instances/m8g.large.toml \
#       benchmarks/cohere-1m-mkt-vs-hnsw.toml \
#       --clean-run --comment "cohere-1m ladder: m8g.large 8 GiB"
#
#   for rung in c8g.large c8g.medium; do
#     rekall infra resize -c "infra/instances/$rung.toml"
#     rekall infra run    -c "infra/instances/$rung.toml" \
#         benchmarks/cohere-1m-mkt-vs-hnsw.toml \
#         --clean-run --comment "cohere-1m ladder: $rung"
#   done
#
# 8 GiB is the rung that builds because it is the smallest whose stock
# maintenance_work_mem exceeds the ~2 GB HNSW graph, so the graph is built in
# memory and in parallel and every rung then measures HNSW's best artifact.
# At the lower rungs init, load and index all skip. --clean-run keeps each
# rung a separate published run.
#
# Then apply the target on the workstation:
#
#   scripts/cost-frontier.py --recall 0.95 --qps 100 \
#       m8g.large=<run url> c8g.large=<run url> c8g.medium=<run url>
#
# Arms
# ----
# mkt-defaults-rerank-sweep
#     Meerkat exactly as shipped -- no index params -- swept over BOTH query
#     knobs, mkt.nprobe x mkt.rerank_pool. At 1M rows the tuned defaults
#     already sit on the measured optimum (auto nlist = rows/256 = 3906,
#     auto nprobe = 32, fastscan + centroid fastscan, SOAR 1.0, boundary
#     0.35), so the index needs no tuning; the sweep is over query time.
#     rerank_pool = 0 is the shipped automatic value (16*k), so the plain
#     defaults arm is a point inside this sweep rather than a separate arm.
#     Warm, this measures rerank_pool's pure CPU cost -- the control for the
#     ladder, where the same knob is paying for random heap I/O instead.
#
# hnsw-m24-halfvec
#     pgvector's recommended default per the pg-aiguide tuning guide, and
#     the arm every other rekall cohere suite uses. Highest HNSW recall.
#     Built on the `v::halfvec(768)` expression -- no materialized column,
#     no table rewrite, so `v` stays available for Meerkat's exact rerank.
#
# hnsw-halfvec
#     The same thing at m=16. Not a tuning arm: it is the *smallest*
#     HNSW graph anyone would deploy here, and the sizing question ("can
#     HNSW fit on a small box at all?") has to be answered against that,
#     not just against the recommended M.
#
#     The published runs say it will barely help. At 768d the vector
#     payload dominates an HNSW node and the neighbour lists do not:
#     m=16 fullvec measures 3.74 GB/M rows (laion-5M) against m=24
#     fullvec's 3.81 GB/M (cohere), i.e. ~2% smaller. So m=16 halfvec
#     should land near ~1.9 GB, essentially the same as m=24 -- lowering
#     M is not an escape route from HNSW's footprint at this
#     dimensionality. This arm is here to demonstrate that, and the
#     ladder should confirm both HNSW arms hit the same memory wall.
#
# Full-precision HNSW is dropped -- halfvec supersedes it. Binary
# quantization is dropped too: at 1M the BQ graph is small (~0.5 GB) but the
# 80x-oversampled rerank turns every query into ~800 random heap fetches,
# which is a strictly worse memory profile than Meerkat's 160 for a lower
# recall ceiling. IVFFlat is covered by cohere-1m-ivfflat.toml.
#
# Usage (from your WORKSTATION -- infra run executes it on the instance):
#
#   rekall infra up  -c infra/instances/m8g.large.toml
#   rekall infra run -c infra/instances/m8g.large.toml \
#       benchmarks/cohere-1m-mkt-vs-hnsw.toml
#
# The first invocation BUILDS; every later rung reuses these indexes.
# Remote runs auto-publish.
#
# `rekall load` / `index` / `search` are instance-side commands and are only
# needed if you want manual phase control -- get a shell with
# `rekall infra ssh -c infra/instances/m8g.large.toml` first.
#
# One suite at every rung, so the arm list -- and hence the on-disk index
# names, which are derived from it -- cannot drift between build and search.
indexes = [
    "indexes/mkt-defaults-rerank-sweep.toml",
    "indexes/hnsw-m24-halfvec.toml",
    "indexes/hnsw-halfvec.toml",
]

[[suite]]
dataset = "datasets/cohere-1m.toml"
