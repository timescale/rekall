# Remote profile: run the cohere-10M meerkat nlist sweep on the
# perf/fastscan-centroids branch. `rekall infra run` uploads this + the suite
# it extends (+ datasets/indexes) and the instance builds the branch first.
# Prereqs: push perf/fastscan-centroids to origin (timescale/meerkat); rebuild
# the instance's rekall to latest main.
extends = "cohere-10m-mkt-nlist.toml"

[meerkat]
branch = "perf/fastscan-centroids"
sudo = true                  # instance builddir + PG lib are root-owned
# recreate_extension = true  # only if the branch changes extension SQL/metadata
