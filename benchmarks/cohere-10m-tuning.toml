# Suite: cohere-10m parameter-tuning sweep.
#
# Requires a pg_vectorsearch build with the tuned defaults (auto nlist/nprobe,
# fastscan + centroid fastscan, SOAR 1.0, boundary 0.35, beam 0.5 +
# floor). The anchor is prism-defaults — the exact out-of-the-box
# configuration, nlist auto (~39k here) — and every other arm changes
# ONE thing against it:
#
#   nlist:        n24000 (~416 rows/list) and n64000 (~156) bracket
#                 the automatic rows/256
#   boundary:     eps 0 (SOAR-only) and eps 0.45 (the July sweeps
#                 improved through 0.35 and never probed beyond)
#   ablations:    SOAR off, all replication off, centroid compression
#                 off, posting fastscan off — single reference points
#                 for each feature's cost/benefit on current code, not
#                 sweeps (the features are known wins)
#   query GUCs:   fastscan_bits 8, beam scale 0.25/1.0, capped rerank
#                 pool — one-knob validations of the query defaults on
#                 a second copy of the default index (prism-defaults-x)
#
# Every sweep includes nprobe=0, the shipped auto default, so the
# heuristic is validated on every index shape. ~10 builds at roughly
# 10-20 minutes each plus sweeps: an afternoon on an r8i.4xlarge.
#
# Usage: rekall run benchmarks/cohere-10m-tuning.toml [--dry-run]

indexes = [
    "indexes/prism-defaults.toml",
    "indexes/prism-defaults-experiments.toml",
    "indexes/prism-tuned-n24000.toml",
    "indexes/prism-tuned-n64000.toml",
    "indexes/prism-tuned-eps0.toml",
    "indexes/prism-tuned-eps45.toml",
    "indexes/prism-tuned-soar-off.toml",
    "indexes/prism-tuned-replication-off.toml",
    "indexes/prism-tuned-cc-off.toml",
    "indexes/prism-tuned-fastscan-off.toml",
]

[[suite]]
dataset = "datasets/cohere-10m.toml"
