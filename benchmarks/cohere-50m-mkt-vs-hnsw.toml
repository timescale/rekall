# Suite: cohere-50m -- optimized Meerkat vs pgvector HNSW M=24.
#
# Meerkat arms use the tuned configuration (centroid compression + FASTSCAN
# centroids + fastscan-16 + SOAR + boundary, error_scale=0, beam_scale=0.25) at
# the nlist sweet spot found during tuning: n240000 (~208 vecs/list) is the
# config that beat HNSW in the mid-recall band, plus one step below it (n120000,
# ~416 vecs/list) to show that coarser lists perform worse. This supersedes the
# earlier n24000->n80000 sweep, which was far below the measured optimum; the
# finer n480000 only tied n240000, so it is dropped too.
#
# Build on the largest box: n120k/n240k k-means sample buffers are ~94 GB /
# ~188 GB (nlist*256*dim*4) until the streaming sample fix lands; the full
# hnsw-m24 build on 50M is also a multi-hour long pole.
#
# Usage: rekall run benchmarks/cohere-50m-mkt-vs-hnsw.toml [--dry-run]

indexes = [
    "indexes/mkt-n120000-cctrue-fs16-soar-cfs.toml",
    "indexes/mkt-n240000-cctrue-fs16-soar-cfs.toml",
    "indexes/hnsw-m24-halfvec.toml",
    "indexes/hnsw-m24-bq.toml",
]

[[suite]]
dataset = "datasets/cohere-50m.toml"
