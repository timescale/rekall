# Remote profile: run the cohere-50M PRISM-vs-HNSW suite on the
# fix/parallel-build-sample-gather-memory branch. That branch is
# perf/fastscan-centroids (so centroid_fastscan params resolve) plus the fix
# for the parallel-build per-cluster sample gather that exceeded MaxAllocSize
# at high nlist (the n80000 build crash). `rekall infra run` uploads this +
# the suite it extends (+ datasets/indexes); the instance checks out and
# builds the branch before the run.
#
# Prereqs:
#   - push fix/parallel-build-sample-gather-memory to origin (timescale/pg_vectorsearch)
#   - the instance's rekall must be latest main (has [pg_vectorsearch] branch builds)
#   - launch on r8i.16xlarge or 24xlarge (1000 GB volume — see infra/instances/)
extends = "cohere-50m-prism-vs-hnsw.toml"

[pg_vectorsearch]
branch = "fix/parallel-build-sample-gather-memory"
sudo = true                  # instance builddir + PG lib are root-owned
# recreate_extension = true  # only if the branch changes extension SQL/metadata
