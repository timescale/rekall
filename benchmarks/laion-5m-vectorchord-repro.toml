# Suite: laion-5m -- reproduce VectorChord's comparative benchmark blog
# ("Vector Search over PostgreSQL: A Comparative Analysis of Memory and
# Disk Solutions"), the most complete published VectorChord methodology,
# and put Meerkat on the same axes.
#
# Their experiments, and how to reproduce each:
#   - "Vectors in memory": i4i.xlarge, shared_buffers 24GB, warm cache.
#       rekall infra up -c infra/instances/i4i.xlarge.toml
#   - "Vectors on disk": c6id.large (4 GB RAM << 15 GB of vectors),
#     shared_buffers 2GB -- the disk-bound regime.
#       rekall infra up -c infra/instances/c6id.large.toml
#   Both boxes put PGDATA on the local NVMe instance store, as they did.
#
# Same suite file for both; only the instance differs. Their blog used
# VectorChord 0.2.2 / pgvector 0.8.0; the instance configs pin the
# current 1.1.1 / 0.8.5 -- reproducing the setup, not the bit-exact
# versions. pgvectorscale (in their comparison) has no rekall backend
# and is out of scope. pgvector runs both plausible baselines since
# their HNSW configuration is unpublished: CREATE INDEX defaults
# (m=16, efc=64) and the tuned efc=200 build.
#
# Meerkat runs only the tuned arm (mkt-laion5m-tuned.toml, index name
# "meerkat-fs8") -- mkt-defaults (untouched fastscan_bits=16 and query
# GUCs) is dominated by it at every recall measured here, so it's left
# out of this suite rather than run alongside for no signal. See that
# file's header comment for why the tuning is dataset-specific.
#
# Usage: rekall run benchmarks/laion-5m-vectorchord-repro.toml [--dry-run]

indexes = [
    "indexes/vchordrq-laion5m.toml",
    "indexes/hnsw-m16-efc64-fullvec.toml",
    "indexes/hnsw-m16.toml",
    "indexes/mkt-laion5m-tuned.toml",
]

[[suite]]
dataset = "datasets/laion-5m.toml"
