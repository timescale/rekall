# Suite: cohere-100M — PRISM only, two nlist arms. No HNSW on purpose:
# this suite is sized for small/medium instances, where a 100M HNSW build
# cannot run (the halfvec build graph is ~260 GB and must fit
# maintenance_work_mem or the build degenerates to the on-disk insert pass;
# see cohere-100m-mkt-vs-hnsw.toml for the big-box suite). The pg_vectorsearch
# build is memory-bounded: the k-means sample buffer is capped at
# maintenance_work_mem and the posting phase streams
# (feature/build-memory-bounded), so peak build RAM ≈ maintenance_work_mem
# regardless of nlist.
#
# nlist arms bracket the measured sweet zone (at 10M, ~250 vecs/list beat
# ~416; at 50M the optimum was ~208/list):
#   - n240000 (~416 vecs/list): cheaper build (fewer centroids, less
#     k-means subsampling on a small box).
#   - n400000 (~250 vecs/list): the ~256-vecs/list heuristic pick for 100M.
# On a small box both arms subsample k-means training data (ideal =
# nlist*256 samples; cap = mwm/(dim*4B), e.g. 51 GB mwm -> ~17M samples =
# ~43/list at n400000). How much that subsampling costs in recall is part
# of what this suite measures — compare against the big-box
# cohere-100m-mkt-vs-hnsw numbers.
#
# DISK: ~800 GB+ free (dataset HDF5 ~290 GB + heap ~358 GB + pg_vectorsearch
# ~25 GB/arm + WAL). The small/medium r8i configs commit only 250-500 GB,
# so set disk_size_gb = 1000 in the instance's .local.toml.
#
# Search-phase caveat: pg_vectorsearch reranks from the heap (~358 GB), which
# exceeds RAM on small/medium boxes — rerank heap fetches go to disk, so
# recall curves are comparable to big-box runs but QPS is not.
#
# Usage: rekall infra run -c infra/instances/r8i.4xlarge.toml \
#            benchmarks/cohere-100m-prism.toml --comment "..."

indexes = [
    "indexes/mkt-n400000-cctrue-fs16-soar-cfs-eps035.toml",
]

[[suite]]
dataset = "datasets/cohere-100m.toml"
