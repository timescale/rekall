# Suite: cohere-100M — PRISM (optimized: centroid_fastscan + SOAR, nlist=400k
# via the ~256 vecs/list heuristic, with the 100M-tuned two-regime query GUCs:
# beam_scale 1.0 + rerank_pool 40 at low nprobe, beam_scale 0.5 + full rerank
# at mid/high — see indexes/prism-n400000-cctrue-fs16-soar-cfs.toml; requires
# pg_vectorsearch with prism.rerank_pool, feature/build-memory-bounded >= 2026-07-08)
# vs pgvector HNSW M=24 halfvec (expression index on v -- no table rewrite).
# The BQ+rerank arm was dropped: measured at 100M it sits an order of
# magnitude below both other curves (0.95 recall at ~24 QPS), adding cost
# without an interesting comparison.
#
# The pg_vectorsearch arms sweep boundary replication: no boundary, then
# boundary_epsilon 0.15 / 0.25 / 0.35, to test whether a wider replication
# band improves recall at this scale. Wider eps replicates more vectors,
# so build time and index size grow with it.
#
# DISK: ~600 GB+ free required (heap ~380 GB + halfvec ~190 GB + pg_vectorsearch ~30 GB)
# plus the ~300 GB dataset load. Build on a >=2 TB volume; the 100M halfvec
# graph build and the n400k pg_vectorsearch build are each multi-hour.
#
# Usage: rekall run benchmarks/cohere-100m-prism-vs-hnsw.toml

indexes = [
    "indexes/prism-n400000-cctrue-fs16-soar-cfs.toml",
    "indexes/prism-n400000-cctrue-fs16-soar-cfs-eps015.toml",
    "indexes/prism-n400000-cctrue-fs16-soar-cfs-eps025.toml",
    "indexes/prism-n400000-cctrue-fs16-soar-cfs-eps035.toml",
    "indexes/hnsw-m24-halfvec.toml",
]

[[suite]]
dataset = "datasets/cohere-100m.toml"
