# Base suite, cohere-1M: out-of-the-box PRISM vs the pgvector HNSW
# baseline. Every index parameter is left to PRISM's auto settings
# (auto nlist = rows/256, fastscan + centroid fastscan, SOAR 1.0,
# boundary 0.35, auto rerank); the only query-time sweep is nprobe.
# prism-defaults-1m is the 1M variant of the shared defaults arm: its
# nprobe tail stops at 320, past which the sweep is near-brute-force at
# this scale.
#
# Usage: rekall run benchmarks/cohere-1m.toml [--dry-run]

indexes = [
    "indexes/prism-defaults-1m.toml",
    "indexes/hnsw-m24-halfvec.toml",
]
[[suite]]
dataset = "datasets/cohere-1m.toml"
