# Suite: cohere-100M — Meerkat (optimized: centroid_fastscan + SOAR, nlist=400k
# via the ~256 vecs/list heuristic, with the 100M-tuned two-regime query GUCs:
# beam_scale 1.0 + rerank_pool 40 at low nprobe, beam_scale 0.5 + full rerank
# at mid/high — see indexes/mkt-n400000-cctrue-fs16-soar-cfs.toml; requires
# meerkat with mkt.rerank_pool, feature/build-memory-bounded >= 2026-07-08)
# vs pgvector HNSW M=24: halfvec expression index (the default baseline) plus
# binary quantization with 80x-oversampling rerank (its memory savings matter
# most at 100M). Both are expression indexes on v -- no table rewrite.
#
# DISK: ~600 GB+ free required (heap ~380 GB + halfvec ~190 GB + meerkat ~30 GB)
# plus the ~300 GB dataset load. Build on a >=2 TB volume; the 100M halfvec
# graph build and the n400k meerkat build are each multi-hour.
#
# Usage: rekall run benchmarks/cohere-100m-mkt-vs-hnsw.toml

indexes = [
    "indexes/mkt-n400000-cctrue-fs16-soar-cfs.toml",
    "indexes/hnsw-m24-halfvec.toml",
    "indexes/hnsw-m24-bq.toml",
]

[[suite]]
dataset = "datasets/cohere-100m.toml"
