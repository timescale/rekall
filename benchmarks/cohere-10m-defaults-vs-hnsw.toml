# Suite: cohere-10m — out-of-the-box PRISM vs the tuned pgvector
# HNSW baseline. The 10M sibling of cohere-100m-defaults-vs-hnsw.toml.
#
# Exactly two builds, to compare how the indexes build and then trade
# recall for throughput on the same hardware:
#
#   prism-defaults      built by a bare CREATE INDEX — no options, no
#                     pinned GUCs, auto nlist ≈ 39k (requires a
#                     pg_vectorsearch build with the tuned defaults). The
#                     search phase still sweeps nprobe for the full
#                     recall/QPS line; the nprobe=0 point on it is
#                     the shipped auto default
#   hnsw-m24-halfvec  the pg-aiguide-tuned baseline (m=24,
#                     ef_construction=200, halfvec expression index)
#
# Fits any box in the ladder: the working set is ~100 GB on disk
# (dataset ~29 GB + heap ~38 GB + halfvec graph ~20 GB + pg_vectorsearch
# ~3 GB), and a 4xlarge's auto maintenance_work_mem (~51 GiB) already
# holds the HNSW graph in RAM for a single-pass build.
#
# Usage: rekall run benchmarks/cohere-10m-defaults-vs-hnsw.toml [--dry-run]

indexes = [
    "indexes/prism-defaults.toml",
    "indexes/hnsw-m24-halfvec.toml",
]

[[suite]]
dataset = "datasets/cohere-10m.toml"
