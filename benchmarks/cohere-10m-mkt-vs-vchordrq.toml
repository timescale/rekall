# Suite: cohere-10M — one Meerkat (best n24000 config) vs VectorChord (vchordrq).
#
# Meerkat: mkt-n24000-cctrue-fs16-soar (centroid compression + fastscan-16 +
# SOAR) — the tuned best at n24000, runs on the installed/main Meerkat (no
# centroid_fastscan branch needed). To test centroid_fastscan too, swap in
# mkt-n24000-cctrue-fs16-soar-cfs and run via the fastscan-centroids profile.
#
# VectorChord: lists=24000 to match Meerkat's nlist (like-for-like partition
# granularity), across its full quantization frontier — 1-bit, 8-bit, and
# 4-bit+rerank. This is the index now packaging Databricks Lakebase / Neon's
# lakebase_vector, so it's the OSS index to beat.
#
# Both index families are IVF + RaBitQ; the comparison isolates Meerkat's
# SOAR/boundary replication + hierarchical+fastscan routing against
# VectorChord's residual-quantization + spherical-centroids approach.
#
# Usage: rekall run benchmarks/cohere-10m-mkt-vs-vchordrq.toml [--dry-run]

indexes = [
    "indexes/mkt-n24000-cctrue-fs16-soar.toml",
    "indexes/vchordrq-n24000.toml",
    "indexes/vchordrq-rabitq8-n24000.toml",
    "indexes/vchordrq-rabitq4-rerank-n24000.toml",
]

[[suite]]
dataset = "datasets/cohere-10m.toml"
