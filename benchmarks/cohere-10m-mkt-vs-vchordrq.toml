# Suite: cohere-10M — one PRISM (best n24000 config) vs VectorChord (vchordrq).
#
# Each index uses its OWN recommended/tuned nlist, not a forced match:
#   - PRISM: mkt-n24000-cctrue-fs16-soar (the tuned best at n24000; runs on
#     installed/main PRISM, no centroid_fastscan branch needed).
#   - VectorChord: lists=16000 — VectorChord has no auto-nlist (empty lists =
#     flat index), so this follows their docs' 4*sqrt(N)..8*sqrt(N) sizing for
#     10M (mid-range ~5*sqrt(N)). Across its quantization frontier: 1-bit
#     (residual quant on), 8-bit, and 4-bit+rerank. residual_quantization is
#     off for the 8/4-bit arms — VectorChord doesn't support it there.
#
# VectorChord is the index now powering Databricks Lakebase / Neon's
# lakebase_vector, so it's the OSS index to beat. Both families are IVF +
# RaBitQ; the comparison pits PRISM's SOAR/boundary replication +
# hierarchical+fastscan routing against VectorChord's residual quantization +
# spherical centroids.
#
# Usage: rekall run benchmarks/cohere-10m-mkt-vs-vchordrq.toml [--dry-run]

indexes = [
    "indexes/mkt-n24000-cctrue-fs16-soar.toml",
    "indexes/vchordrq-n16000.toml",
    "indexes/vchordrq-rabitq8-n16000.toml",
    "indexes/vchordrq-rabitq4-rerank-n16000.toml",
]

[[suite]]
dataset = "datasets/cohere-10m.toml"
