# VectorChord vchordrq arm for LAION-5M using hierarchical two-level
# partitioning, per EnterpriseDB's public vsbt reference config for this
# same dataset (github.com/EnterpriseDB/vsbt,
# config/laion-5m-test-ip/vectorchord-190-35k.yaml). That YAML isn't
# authoritative for VectorChord's own blog post (metric=dot,
# build_threads=32, pg_parallel_workers=32 don't match the blog's L2 /
# 4-vCPU i4i.xlarge setup, and the blog doesn't reference vsbt at all)
# -- it's a separate EnterpriseDB benchmark exercise that happens to use
# the same dataset mirror. This arm exists to test the one part of it
# that's still a real, feasible structural comparison: hierarchical
# lists=[190, 35000] instead of the flat lists=[8192] the other vchordrq
# arm uses. Kept on L2 (not vsbt's dot metric -- rekall's Metric enum
# only supports angular/euclidean today, dataset-scoped rather than
# per-arm, so testing "dot" properly would need a rekall code change)
# and kept our own kmeans_iterations=25 / sampling_factor=611, so this
# arm isolates the lists-structure question rather than changing
# multiple variables at once.
[[index]]
type = "vchordrq"
name = "vchordrq-laion5m-hier190-35k"
[index.params]
lists = [190, 35000]
residual_quantization = true
spherical_centroids = false
build_threads = 4
kmeans_iterations = 25
sampling_factor = 611

[[search.sweep]]
index = "vchordrq-laion5m-hier190-35k"
[search.sweep.params]
"vchordrq.probes" = ["15,30", "20,40", "38,76", "50,100", "65,130", "80,160", "160,320"]
"vchordrq.epsilon" = [1.0, 1.3, 1.6, 1.9]
