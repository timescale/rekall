# PRISM: nlist=4000, no centroid compression, fastscan-16, SOAR
[[index]]
type = "prism"
name = "mkt-n4000-ccfalse-fs16-soar"
[index.params]
nlist = 4000
centroid_compression = false
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n4000-ccfalse-fs16-soar"
[search.sweep.params]
"prism.nprobe" = [5, 10, 20, 40, 80, 120, 200, 400, 600, 1000]
