# pgvector IVFFlat over a binary-quantized expression index (`(binary_quantize(v)::bit(N)) bit_hamming_ops`), ~32x smaller for the cohere 100m suites.
# lists = 10000 -- pgvector guidance: sqrt(rows) beyond 1M rows.
# ivfflat.probes swept for the recall/QPS curve; raw-mode recall is bounded
# by the probed lists' contents (no ef-style depth knob). The ladder stops
# at 320: each probe scans ~rows/lists tuples, so deeper points cost hours
# of sweep time for QPS below practical interest (probes = lists would be
# a full-table scan per query).
# Always reranked: raw Hamming ranking alone has low recall, so this
# over-fetches a candidate pool by Hamming from the probed lists and
# re-ranks it by full-precision cosine on v (80x oversampling at k=10,
# the pg-aiguide starting point).
[[index]]
type = "pgvector-ivfflat"
name = "ivfflat-100m-bq"
table_parallel_workers = 32
[index.params]
lists = 10000
encoding = "bit"

[[query]]
name = "ivfflat-100m-bq-rerank"
index = "ivfflat-100m-bq"
mode = "rerank"
[query.params]
rerank_pool = [800]
"ivfflat.probes" = [1, 2, 5, 10, 20, 40, 80, 160, 320]
