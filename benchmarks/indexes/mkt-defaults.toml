# Pure defaults: no index parameters, no GUCs — exactly what a user
# gets from CREATE INDEX ... USING mktann with an untuned session.
# Requires a meerkat build with the tuned defaults (auto nlist,
# fastscan + centroid fastscan, SOAR 1.0, boundary 0.35, auto nprobe,
# beam 0.5 + floor).
#
# The nprobe sweep starts at 0 = the shipped auto default (that point
# is the out-of-the-box experience); the rest draws the full curve.
# One universal list serves every scale — the tail past a dataset's
# 0.999 recall just costs a little runtime.
[[index]]
type = "meerkat"
name = "mkt-defaults"
table_parallel_workers = 32

[[search.sweep]]
index = "mkt-defaults"
[search.sweep.params]
"mkt.nprobe" = [0, 10, 20, 40, 80, 160, 320, 640, 1280, 2560]
