# VectorChord vchordrq (1-bit RaBitQ) on the plain `vector` column.
# lists=16000 follows VectorChord's OWN sizing for 10M, not a Meerkat match:
# their docs recommend 4*sqrt(N)..8*sqrt(N) for 2M-50M rows (12.6k..25.3k for
# 10M); 16000 is the mid-range (~5*sqrt(N), ~625 vecs/list). VectorChord has no
# auto-nlist — an empty `lists` builds a FLAT (unpartitioned) index, so it must
# be set explicitly. residual_quantization + spherical centroids on per
# VectorChord's cosine guidance (both supported on the 1-bit path).
[[index]]
type = "vchordrq"
name = "vchordrq-n16000"
[index.params]
lists = [16000]
residual_quantization = true
spherical_centroids = true
build_threads = 16

[[search.sweep]]
index = "vchordrq-n16000"
[search.sweep.params]
"vchordrq.probes" = ["5", "10", "20", "40", "80", "160", "320", "640", "1280", "2560"]
