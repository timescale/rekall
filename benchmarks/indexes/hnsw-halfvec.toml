# pgvector HNSW on a halfvec (f16) column. ~2x smaller index than the
# full-precision `vector` build; small recall loss in exchange.
[[index]]
type = "pgvector-hnsw"
name = "hnsw-halfvec"
[index.params]
m = 16
ef_construction = 200
column_type = "halfvec"

[[search.sweep]]
index = "hnsw-halfvec"
[search.sweep.params]
"hnsw.ef_search" = [10, 20, 40, 80, 120, 200, 400, 800, 1000]
