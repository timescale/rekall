# pgvector HNSW over a halfvec (f16) expression index (`v::halfvec(N)`).
# ~2x smaller index than the full-precision `vector` build; small recall
# loss in exchange. No materialized column — indexed directly on `v`.
[[index]]
type = "pgvector-hnsw"
name = "hnsw-halfvec"
[index.params]
m = 16
ef_construction = 200
encoding = "halfvec"

[[search.sweep]]
index = "hnsw-halfvec"
[search.sweep.params]
"hnsw.ef_search" = [10, 20, 40, 80, 120, 200, 400, 800, 1000]
