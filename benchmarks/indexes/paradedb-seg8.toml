# ParadeDB (pg_search) vector index with ParadeDB's own benchmark build:
# 8 segments, everything else at its defaults (target_leaf_size 400,
# replication 2, [1,1] quantization, quantized router). The segment count
# is pinned because its default follows the build session's
# max_parallel_workers_per_gather. Needs pg_search in
# shared_preload_libraries, and ParadeDB allows one ParadeDB index per
# table: see docs/configuration.md.
#
# paradedb.vector_cluster_max_probe is a ceiling on probing work in units
# of an average cluster (adaptive probing may stop earlier). Its minimum is
# 1 and its default 100.
[[index]]
type = "paradedb"
name = "paradedb-seg8"
[index.params]
target_segment_count = 8

[[search.sweep]]
index = "paradedb-seg8"
[search.sweep.params]
"paradedb.vector_cluster_max_probe" = [5, 10, 20, 40, 80, 160, 320, 640, 1280, 2560, 5120]
