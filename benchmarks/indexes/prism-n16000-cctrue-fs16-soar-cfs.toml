# PRISM optimized (cohere tuning): centroid compression + FASTSCAN centroids,
# fastscan-16, SOAR + boundary replication. nlist=16000 ~= 312 vecs/list at 5M
# -- the best 5M config measured so far. centroid_fastscan, the raised
# nlist/nprobe ceilings, and the error_scale/beam_scale GUCs require the
# feat/cohere-50m-perf branch.
[[index]]
type = "prism"
name = "prism-n16000-cctrue-fs16-soar-cfs"
table_parallel_workers = 32
[index.params]
nlist = 16000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16
# Recall-neutral query optimizations from the 50M tuning. beam_scale is NOT
# the default on feat/cohere-50m-perf (ships 1.0), so set both explicitly.
"prism.centroid_error_scale" = 0
"prism.centroid_beam_scale" = 0.25

[[search.sweep]]
index = "prism-n16000-cctrue-fs16-soar-cfs"
[search.sweep.params]
"prism.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1280, 1800]
