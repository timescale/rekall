# pgvector HNSW at pgvector's OWN defaults (m = 16, ef_construction = 64)
# over full-precision vectors. This is the weakest plausible HNSW
# baseline -- exactly what a comparison gets if it benchmarks pgvector
# with CREATE INDEX defaults -- included to test whether published
# "faster than pgvector" claims were measured against it rather than a
# tuned build (efc 200 arms exist alongside for the strong baseline).
[[index]]
type = "pgvector-hnsw"
name = "hnsw-m16-efc64"
table_parallel_workers = 32
[index.params]
m = 16
ef_construction = 64

[[search.sweep]]
index = "hnsw-m16-efc64"
[search.sweep.params]
"hnsw.ef_search" = [10, 20, 40, 80, 120, 200, 400, 800]
