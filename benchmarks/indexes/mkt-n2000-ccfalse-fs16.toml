# PRISM: nlist=2000, no centroid compression, fastscan-16, no SOAR
[[index]]
type = "prism"
name = "mkt-n2000-ccfalse-fs16"
[index.params]
nlist = 2000
centroid_compression = false
fastscan = true
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n2000-ccfalse-fs16"
[search.sweep.params]
"prism.nprobe" = [3, 5, 10, 20, 40, 80, 120, 200, 400, 600]
