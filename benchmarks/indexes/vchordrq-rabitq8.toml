# VectorChord vchordrq with 8-bit RaBitQ quantization.
#
# Adds an `v_rabitq8 rabitq8(d)` column to the table populated via
# quantize_to_rabitq8(v), and builds vchordrq on that column with
# `rabitq8_cosine_ops`. Index size is roughly 8x smaller than the
# plain variant; recall loss is <1% per VectorChord's docs.

[[index]]
type = "vchordrq-rabitq8"
name = "vchordrq-rabitq8-lists-1000"
[index.params]
lists = [1000]
residual_quantization = true
spherical_centroids = true
build_threads = 8

[[search.sweep]]
index = "vchordrq-rabitq8-lists-1000"
[search.sweep.params]
"vchordrq.probes" = ["5", "10", "20", "40", "80", "160"]
