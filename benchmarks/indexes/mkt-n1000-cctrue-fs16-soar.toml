# PRISM: nlist=1000, centroid compression, fastscan-16, SOAR
[[index]]
type = "prism"
name = "mkt-n1000-cctrue-fs16-soar"
[index.params]
nlist = 1000
centroid_compression = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n1000-cctrue-fs16-soar"
[search.sweep.params]
"prism.nprobe" = [3, 5, 10, 20, 40, 80, 120, 200, 300]
