# Meerkat: nlist=8000, centroid compression, fastscan-16, SOAR
[[index]]
type = "meerkat"
name = "mkt-n8000-cctrue-fs16-soar"
# Let Meerkat's build use the full max_parallel_maintenance_workers; its
# standard-AM path is otherwise derated by the planner's heap-size heuristic.
# Reset automatically before non-requesting builds, so pgvector is unaffected.
table_parallel_workers = 32
[index.params]
nlist = 8000
centroid_compression = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n8000-cctrue-fs16-soar"
[search.sweep.params]
"mkt.nprobe" = [5, 10, 20, 40, 80, 120, 200, 400, 600, 1000]
