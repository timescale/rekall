# Query-GUC experiments on the default index shape (same build as
# prism-defaults under a distinct name so both can coexist in a suite).
# Each sweep varies exactly one query-side knob against the shipped
# default to validate the defaults chosen from the July runs:
#   - fastscan_bits 8 vs the default 16
#   - beam scale 0.25 / 1.0 vs the default 0.5 + floor
#   - a capped rerank pool (the old low-recall-regime trick) vs auto
[[index]]
type = "prism"
name = "prism-defaults-x"
table_parallel_workers = 32

[[search.sweep]]
index = "prism-defaults-x"
[search.sweep.params]
"prism.nprobe" = [10, 40, 160, 640]
"prism.fastscan_bits" = [8]

[[search.sweep]]
index = "prism-defaults-x"
[search.sweep.params]
"prism.nprobe" = [10, 40, 160, 640]
"prism.centroid_beam_scale" = [0.25]

[[search.sweep]]
index = "prism-defaults-x"
[search.sweep.params]
"prism.nprobe" = [10, 40, 160, 640]
"prism.centroid_beam_scale" = [1.0]

[[search.sweep]]
index = "prism-defaults-x"
[search.sweep.params]
"prism.nprobe" = [10, 20, 40, 80, 160]
"prism.rerank_pool" = [40]
