# Meerkat: nlist=60000, centroid compression + FASTSCAN centroids, fs16, SOAR.
# Sized for cohere-50M (~833 vecs/list at 60000 lists). centroid_fastscan
# requires the perf/fastscan-centroids branch. At this list count centroid
# routing is a larger slice of query time, which is where fastscan centroids
# pay off most.
[[index]]
type = "meerkat"
name = "mkt-n60000-cctrue-fs16-soar-cfs"
table_parallel_workers = 32
[index.params]
nlist = 60000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16
# Recall-neutral query optimizations from the 50M tuning. beam_scale is NOT
# the default on feat/cohere-50m-perf (ships 1.0), so set both explicitly.
"mkt.centroid_error_scale" = 0
"mkt.centroid_beam_scale" = 0.25

[[search.sweep]]
index = "mkt-n60000-cctrue-fs16-soar-cfs"
[search.sweep.params]
"mkt.nprobe" = [20, 40, 80, 160, 320, 640, 1280, 2560, 5120, 7000]
