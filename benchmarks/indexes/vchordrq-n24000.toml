# VectorChord vchordrq (1-bit RaBitQ) on the plain `vector` column, tuned for
# cohere-10M. lists=24000 matches Meerkat's nlist for a like-for-like partition
# count (~417 vecs/list) and sits at the top of VectorChord's recommended
# 4*sqrt(N)..8*sqrt(N) range for 10M. residual_quantization + spherical
# centroids on per VectorChord's cosine guidance.
[[index]]
type = "vchordrq"
name = "vchordrq-n24000"
[index.params]
lists = [24000]
residual_quantization = true
spherical_centroids = true
build_threads = 16

[[search.sweep]]
index = "vchordrq-n24000"
[search.sweep.params]
# probes = lists scanned; swept to match Meerkat's nprobe range at n24000.
"vchordrq.probes" = ["10", "20", "40", "80", "160", "320", "640", "1280", "2560", "4000"]
