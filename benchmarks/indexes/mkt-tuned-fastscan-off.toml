# Array-of-structs posting pages: reference for what the packed\n# FASTSCAN posting layout buys at query time on current code.
# Everything not set stays at the shipped defaults; nprobe=0
# exercises the auto heuristic on this shape.
[[index]]
type = "prism"
name = "mkt-tuned-fastscan-off"
table_parallel_workers = 32
[index.params]
fastscan = false

[[search.sweep]]
index = "mkt-tuned-fastscan-off"
[search.sweep.params]
"prism.nprobe" = [0, 10, 20, 40, 80, 160, 320, 640, 1280, 2560]
