# pgvector HNSW M=24 over a halfvec (f16) expression index (`v::halfvec(N)`).
# ~2x smaller index + faster build than the full-precision vector graph, with
# a small recall loss. No materialized column — indexed directly on `v`. m=24
# matches the cohere-50M comparison (the repo's hnsw-halfvec is m=16).
[[index]]
type = "pgvector-hnsw"
name = "hnsw-m24-halfvec"
table_parallel_workers = 32
[index.params]
m = 24
ef_construction = 200
encoding = "halfvec"

[[search.sweep]]
index = "hnsw-m24-halfvec"
[search.sweep.params]
"hnsw.ef_search" = [10, 20, 40, 80, 120, 200, 400, 800, 1000]
