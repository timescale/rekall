# pgvector HNSW M=24 over a halfvec (f16) EXPRESSION index
# (`(v::halfvec(N)) halfvec_cosine_ops`) -- the DEFAULT pgvector baseline per
# the pg-aiguide HNSW tuning guide ("use halfvec by default: 50% smaller, minimal
# recall loss"). ~2x smaller index + faster build than the full-precision graph.
# No materialized column / no table rewrite -- indexed directly on the `v::halfvec`
# expression, so the full `v` column stays in the table for other indexes.
#   https://github.com/timescale/pg-aiguide/blob/main/skills/pgvector-semantic-search/SKILL.md
[[index]]
type = "pgvector-hnsw"
name = "hnsw-m24-halfvec"
table_parallel_workers = 32
[index.params]
m = 24
ef_construction = 200
encoding = "halfvec"

[[search.sweep]]
index = "hnsw-m24-halfvec"
[search.sweep.params]
# ef_search is hard-capped at 1000 by pgvector (GUC max), which bounds the
# recall this index can reach regardless of cost — 0.9854 measured on
# cohere-100M. Recall targets above that are unreachable for HNSW here.
"hnsw.ef_search" = [10, 20, 40, 80, 100, 120, 200, 400, 800, 1000]
