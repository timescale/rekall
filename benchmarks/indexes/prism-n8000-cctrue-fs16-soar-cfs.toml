# PRISM optimized (cohere tuning): centroid compression + FASTSCAN centroids,
# fastscan-16, SOAR + boundary replication. nlist=8000 ~= 125 vecs/list at 1M
# -- one step finer than the extrapolated 1M optimum (~n4000-n5000, i.e. the
# ~208 vecs/list density confirmed at 50M), included to check the plateau holds
# at small scale (at 50M finer-than-optimal only tied, never hurt). Requires
# feat/cohere-50m-perf.
[[index]]
type = "prism"
name = "prism-n8000-cctrue-fs16-soar-cfs"
table_parallel_workers = 32
[index.params]
nlist = 8000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16
"prism.centroid_error_scale" = 0
"prism.centroid_beam_scale" = 0.25

[[search.sweep]]
index = "prism-n8000-cctrue-fs16-soar-cfs"
[search.sweep.params]
"prism.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1000, 1500]
