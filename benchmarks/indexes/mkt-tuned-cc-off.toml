# Exact (float) routing centroids: reference for what centroid\n# compression + FASTSCAN centroids cost/buy (centroid_fastscan=auto\n# follows compression off; probe_expand self-disables on exact\n# centroids).
# Everything not set stays at the shipped defaults; nprobe=0
# exercises the auto heuristic on this shape.
[[index]]
type = "prism"
name = "mkt-tuned-cc-off"
table_parallel_workers = 32
[index.params]
centroid_compression = false

[[search.sweep]]
index = "mkt-tuned-cc-off"
[search.sweep.params]
"prism.nprobe" = [0, 10, 20, 40, 80, 160, 320, 640, 1280, 2560]
