# PRISM: nlist=16000, no centroid compression, fastscan-16, no SOAR
[[index]]
type = "prism"
name = "mkt-n16000-ccfalse-fs16"
[index.params]
nlist = 16000
centroid_compression = false
fastscan = true
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n16000-ccfalse-fs16"
[search.sweep.params]
"prism.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1200, 2000, 3000]
