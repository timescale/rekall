# boundary_epsilon 0.15 arm of mkt-n40000-cctrue-fs16-soar-cfs (~250
# vecs/list at 10M; searched equal or slightly better than n24000 but builds
# slower) -- identical except the wider boundary replication band, to test
# whether eps 0.15 improves recall at this list count.
[[index]]
type = "meerkat"
name = "mkt-n40000-cctrue-fs16-soar-cfs-eps015"
table_parallel_workers = 32
[index.params]
nlist = 40000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.15
[index.gucs]
"mkt.fastscan_bits" = 16
"mkt.centroid_error_scale" = 0

# Two-regime query sweep mirroring the 100M-tuned shape (wide beam +
# capped rerank pool at low nprobe, half beam + auto pool at mid/high).
# The flat beam 0.25 these configs carried predates probe expansion and
# the 100M finding that it mis-routes at scale; regime crossover and
# beam values are 100M-derived — re-measure on a live 10M index before
# treating these numbers as tuned. rerank_pool/probe_expand/
# recent_buffers defaults come from the extension.
[[search.sweep]]
index = "mkt-n40000-cctrue-fs16-soar-cfs-eps015"
[search.sweep.params]
"mkt.nprobe" = [10, 20, 40, 80, 160]
"mkt.centroid_beam_scale" = [1.0]
"mkt.rerank_pool" = [40]

[[search.sweep]]
index = "mkt-n40000-cctrue-fs16-soar-cfs-eps015"
[search.sweep.params]
"mkt.nprobe" = [160, 240, 320, 640, 1280, 2560, 5000]
"mkt.centroid_beam_scale" = [0.5]
"mkt.rerank_pool" = [0]
