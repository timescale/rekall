# VectorChord vchordrq with 8-bit RaBitQ. lists=16000 (VectorChord's own 10M
# sizing; see vchordrq-n16000). residual_quantization is NOT supported with
# rabitq8 (per VectorChord docs) — set false explicitly since rekall defaults
# it to true. The 8-bit codes provide the accuracy instead; spherical centroids
# (a clustering choice, independent of quantization) is kept for cosine.
[[index]]
type = "vchordrq-rabitq8"
name = "vchordrq-rabitq8-n16000"
[index.params]
lists = [16000]
residual_quantization = false
spherical_centroids = true
build_threads = 16

[[search.sweep]]
index = "vchordrq-rabitq8-n16000"
[search.sweep.params]
"vchordrq.probes" = ["5", "10", "20", "40", "80", "160", "320", "640", "1280", "2560"]
