# Meerkat: nlist=8000, no centroid compression, fastscan-16, SOAR
[[index]]
type = "meerkat"
name = "mkt-n8000-ccfalse-fs16-soar"
[index.params]
nlist = 8000
centroid_compression = false
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n8000-ccfalse-fs16-soar"
[search.sweep.params]
"mkt.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1200, 2000, 3000]
