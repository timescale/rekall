# boundary_epsilon 0.15 arm of mkt-n24000-cctrue-fs16-soar-cfs (~416
# vecs/list, the cheaper-build of the two 10M arms; n40000 searched equal or
# slightly better but builds slower) -- identical except the wider boundary
# replication band, to test whether eps 0.15 improves recall at this list
# count. See the base file for config rationale and the caveats on the
# 100M-derived two-regime query sweep.
[[index]]
type = "meerkat"
name = "mkt-n24000-cctrue-fs16-soar-cfs-eps015"
table_parallel_workers = 32
[index.params]
nlist = 24000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.15
[index.gucs]
"mkt.fastscan_bits" = 16
"mkt.centroid_error_scale" = 0

# Low-recall regime (~0.60-0.90): wide beam + capped rerank pool.
[[search.sweep]]
index = "mkt-n24000-cctrue-fs16-soar-cfs-eps015"
[search.sweep.params]
"mkt.nprobe" = [10, 20, 40, 80, 160]
"mkt.centroid_beam_scale" = [1.0]
"mkt.rerank_pool" = [40]

# Mid/high-recall regime (~0.90-0.99): half beam + full rerank.
[[search.sweep]]
index = "mkt-n24000-cctrue-fs16-soar-cfs-eps015"
[search.sweep.params]
"mkt.nprobe" = [160, 240, 320, 640, 1280, 2560]
"mkt.centroid_beam_scale" = [0.5]
"mkt.rerank_pool" = [0]
