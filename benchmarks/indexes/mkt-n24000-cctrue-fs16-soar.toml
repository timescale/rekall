# Meerkat: nlist=24000, centroid compression, fastscan-16, SOAR
[[index]]
type = "meerkat"
name = "mkt-n24000-cctrue-fs16-soar"
# Let Meerkat's build use the full max_parallel_maintenance_workers; its
# standard-AM path is otherwise derated by the planner's heap-size heuristic.
# Reset automatically before non-requesting builds, so pgvector is unaffected.
table_parallel_workers = 32
[index.params]
nlist = 24000
centroid_compression = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n24000-cctrue-fs16-soar"
[search.sweep.params]
# Higher nprobe range than the smaller-nlist configs: 24000 lists ≈ 417
# vecs/list, so reaching high recall scans more lists.
"mkt.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1280, 2560, 4000]
