# Meerkat optimized (cohere tuning): centroid compression + FASTSCAN centroids,
# fastscan-16, SOAR + boundary replication. nlist=40000 ~= 250 vecs/list at 10M
# -- one step above the best-tested 10M config (n24000), to check whether a finer
# list count is better (the 10M sweep never went higher; the 50M optimum was
# ~208 vecs/list). Requires feat/cohere-50m-perf.
[[index]]
type = "meerkat"
name = "mkt-n40000-cctrue-fs16-soar-cfs"
table_parallel_workers = 32
[index.params]
nlist = 40000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16
# Recall-neutral query optimizations from the 50M tuning. beam_scale is NOT
# the default on feat/cohere-50m-perf (ships 1.0), so set both explicitly.
"mkt.centroid_error_scale" = 0
"mkt.centroid_beam_scale" = 0.25

[[search.sweep]]
index = "mkt-n40000-cctrue-fs16-soar-cfs"
[search.sweep.params]
# More lists than the 10M sweeps → higher nprobe top end to reach high recall.
"mkt.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1280, 2560, 5000]
