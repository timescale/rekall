# Meerkat: nlist=8000, centroid compression, fastscan-16, no SOAR
[[index]]
type = "meerkat"
name = "mkt-n8000-cctrue-fs16"
[index.params]
nlist = 8000
centroid_compression = true
fastscan = true
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n8000-cctrue-fs16"
[search.sweep.params]
"mkt.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1200, 2000, 3000]
