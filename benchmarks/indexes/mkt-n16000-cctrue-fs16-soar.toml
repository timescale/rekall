# PRISM: nlist=16000, centroid compression, fastscan-16, SOAR
[[index]]
type = "prism"
name = "mkt-n16000-cctrue-fs16-soar"
# Let PRISM's build use the full max_parallel_maintenance_workers; its
# standard-AM path is otherwise derated by the planner's heap-size heuristic.
# Reset automatically before non-requesting builds, so pgvector is unaffected.
table_parallel_workers = 32
[index.params]
nlist = 16000
centroid_compression = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n16000-cctrue-fs16-soar"
[search.sweep.params]
"prism.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1200, 2000, 3000]
