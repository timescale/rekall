# No replication at all: the single-copy baseline both replication\n# forms are measured against (also the index-size floor).
# Everything not set stays at the shipped defaults; nprobe=0
# exercises the auto heuristic on this shape.
[[index]]
type = "prism"
name = "prism-tuned-replication-off"
table_parallel_workers = 32
[index.params]
soar_lambda = 0.0
boundary_epsilon = 0.0

[[search.sweep]]
index = "prism-tuned-replication-off"
[search.sweep.params]
"prism.nprobe" = [0, 10, 20, 40, 80, 160, 320, 640, 1280, 2560]
