# VectorChord vchordrq IVF posting-list index on the plain `vector` column.
#
# Defaults follow VectorChord's docs for cosine workloads:
#   residual_quantization + spherical_centroids on, lists=[1000]
#   single-level partitioning (suitable for ~1M-row tables; bump to
#   [4000] for ~10M, [4096, 262144] hierarchical for ~100M+).

[[index]]
type = "vchordrq"
name = "vchordrq-lists-1000"
[index.params]
lists = [1000]
residual_quantization = true
spherical_centroids = true
build_threads = 8

[[search.sweep]]
index = "vchordrq-lists-1000"
[search.sweep.params]
# vchordrq.probes is a list-typed GUC. Shape must match `lists`;
# with a single-level partition we pass single-value strings.
"vchordrq.probes" = ["5", "10", "20", "40", "80", "160"]
