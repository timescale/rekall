# Boundary-only replication: SOAR off (black/white reference for what\n# SOAR costs at build time and buys in recall on current code).
# Everything not set stays at the shipped defaults; nprobe=0
# exercises the auto heuristic on this shape.
[[index]]
type = "prism"
name = "prism-tuned-soar-off"
table_parallel_workers = 32
[index.params]
soar_lambda = 0.0

[[search.sweep]]
index = "prism-tuned-soar-off"
[search.sweep.params]
"prism.nprobe" = [0, 10, 20, 40, 80, 160, 320, 640, 1280, 2560]
