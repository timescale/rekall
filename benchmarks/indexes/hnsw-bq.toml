# pgvector HNSW over a binary-quantized expression index
# (`binary_quantize(v)::bit(N)` with `bit_hamming_ops`) — pgvector's
# documented recommended setup. ~32x smaller index; raw Hamming recall is
# low, so the two-stage rerank query is usually what you want. No
# materialized column — indexed directly on `v`.
[[index]]
type = "pgvector-hnsw"
name = "hnsw-bq"
[index.params]
m = 16
ef_construction = 200
encoding = "bit"

# Raw single-stage Hamming ranking (fast, low recall).
[[query]]
name = "hnsw-bq-raw"
index = "hnsw-bq"
mode = "raw"
[query.params]
"hnsw.ef_search" = [10, 20, 40, 80, 120, 200, 400, 800, 1000]

# Two-stage rerank: re-rank the HNSW Hamming candidates by full-precision
# cosine on `v`. `hnsw.ef_search` is the recall/speed knob — the scan returns
# at most ef_search candidates regardless of the inner LIMIT — so sweep it
# like the raw query and pin `rerank_pool` ≥ max(ef_search) so every candidate
# is re-ranked (none discarded). Fair frontier: raw's scan cost + the rerank.
[[query]]
name = "hnsw-bq-rerank"
index = "hnsw-bq"
mode = "rerank"
[query.params]
"hnsw.ef_search" = [10, 20, 40, 80, 120, 200, 400, 800, 1000]
rerank_pool = [1000]
