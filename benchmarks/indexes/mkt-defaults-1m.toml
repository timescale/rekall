# Pure defaults for the cohere-1M ladder: no index parameters, no session
# GUCs -- exactly what CREATE INDEX ... USING mktann gives an untuned
# session. Keeps the arm name `mkt-defaults` so plots and published history
# line up with every other cohere suite.
#
# A 1M-specific copy of indexes/mkt-defaults.toml, which is shared by the
# 10m/50m/100m/ivfflat/tuning suites and must not change. The only
# difference is the nprobe tail.
#
# nprobe = [0, 10, 20, 40, 80, 160, 320]
#
# The shared arm (indexes/mkt-defaults.toml, used by the 10m/50m/100m
# suites) runs on to 2560. Stopped at 320 here because the targets this
# ladder reports against are recall 0.90 / 0.95 / 0.99, and nprobe=160
# already measures 0.9941. 320 is the one point past that, kept to show the
# curve flattening rather than to reach anything.
#
# Everything beyond is 0.999+ recall that nobody targets, and at this scale
# it stops describing an IVF operating point at all: nlist is 3906, so 1280
# probes is 33% of the index and 2560 is 66% -- near brute force. The high
# end earns its place at larger scales, where the same nprobe is a small
# fraction of a much larger nlist.
#
# Note runtime is NOT the reason, though an earlier revision of this comment
# claimed it was. Measured at the 4 GiB rung, a 16x increase in nprobe costs
# only 1.5-2x in QPS:
#
#     rerank_pool=20   nprobe 10->160: 372 -> 185 QPS  (2.01x)
#     rerank_pool=40   nprobe 10->160: 191 -> 114 QPS  (1.68x)
#     rerank_pool=80   nprobe 10->160: 147 ->  95 QPS  (1.55x)
#     rerank_pool=160  nprobe 10->160: 126 ->  85 QPS  (1.48x)
#
# The scan is SIMD over compressed codes in a 0.26 GiB index that is
# resident at every rung, so even a very high nprobe is cheap in-memory
# work rather than I/O; and rerank_pool does not scale with nprobe, so the
# expensive part -- random heap fetches -- stays roughly fixed. The slope
# flattens as rerank_pool rises because rerank then dominates the total.
#
#   0 is the auto sentinel: ~0.5*sqrt(nlist), which is 32 at this scale. It
#   is the only point on any curve representing a user who tuned nothing,
#   and it is the only series where BOTH auto settings are in play -- auto
#   nprobe with an explicit rerank_pool is a hybrid, not the out-of-the-box
#   experience, which is why this cannot be folded into the rerank-sweep
#   series. It also self-adjusts with the data (32 at 1M, ~99 at 10M, ~313
#   at 100M) where a hardcoded 32 would not.
#
[[index]]
type = "meerkat"
name = "mkt-defaults"
table_parallel_workers = 32

[[search.sweep]]
index = "mkt-defaults"
[search.sweep.params]
"mkt.nprobe" = [0, 10, 20, 40, 80, 160, 320]
