# PRISM optimized (cohere tuning): centroid compression + FASTSCAN centroids,
# fastscan-16, SOAR + boundary replication. nlist=240000 ~= 208 vecs/list at
# 50M -- the measured sweet spot that beat pgvector HNSW in the mid-recall band
# -- and the cheaper-build arm (~416 vecs/list) of the 100M two-arm suite.
#
# Build memory: the k-means sample buffer wants nlist*256*dim*4 (~188 GB at
# 240000/768d) but is capped at maintenance_work_mem (subsampling, with a
# full-table leaf refine pass compensating) on feature/build-memory-bounded,
# so any box works; below ~188 GB mwm the training data thins out.
#
# Query GUCs use the two-regime shape tuned on the 100M/n400000 index (beam
# 1.0 + rerank_pool 40 at low nprobe, beam 0.5 + auto pool at mid/high). The
# old 50M-tuned flat beam 0.25 measurably mis-routes at 100M, and keeping it
# here would confound the 100M suite's nlist-arm comparison with query
# tuning rather than nlist. The regime split is 100M-derived: re-measure the
# crossover and beam values on a live 50M index before treating 50M numbers
# as tuned. rerank_pool/probe_expand/recent_buffers defaults come from the
# extension (auto 16*k pool, 2.0 expansion, buffer cache on).
[[index]]
type = "prism"
name = "prism-n240000-cctrue-fs16-soar-cfs"
table_parallel_workers = 32
[index.params]
nlist = 240000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16
"prism.centroid_error_scale" = 0

# Low-recall regime (~0.60-0.90): wide beam + capped rerank pool.
[[search.sweep]]
index = "prism-n240000-cctrue-fs16-soar-cfs"
[search.sweep.params]
"prism.nprobe" = [10, 20, 40, 80, 160]
"prism.centroid_beam_scale" = [1.0]
"prism.rerank_pool" = [40]

# Mid/high-recall regime (~0.90-0.99): half beam + full rerank.
[[search.sweep]]
index = "prism-n240000-cctrue-fs16-soar-cfs"
[search.sweep.params]
"prism.nprobe" = [160, 240, 320, 480, 640, 960, 1280, 1920]
"prism.centroid_beam_scale" = [0.5]
"prism.rerank_pool" = [0]
