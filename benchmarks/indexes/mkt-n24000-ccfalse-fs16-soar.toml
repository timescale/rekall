# PRISM: nlist=24000, no centroid compression, fastscan-16, SOAR
[[index]]
type = "prism"
name = "mkt-n24000-ccfalse-fs16-soar"
[index.params]
nlist = 24000
centroid_compression = false
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"prism.fastscan_bits" = 16

[[search.sweep]]
index = "mkt-n24000-ccfalse-fs16-soar"
[search.sweep.params]
"prism.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1280, 2560, 4000]
