# SOAR-only replication: boundary band off. Isolates what the\n# boundary band adds on top of SOAR (recall, index size, build time).
# Everything not set stays at the shipped defaults; nprobe=0
# exercises the auto heuristic on this shape.
[[index]]
type = "prism"
name = "prism-tuned-eps0"
table_parallel_workers = 32
[index.params]
boundary_epsilon = 0.0

[[search.sweep]]
index = "prism-tuned-eps0"
[search.sweep.params]
"prism.nprobe" = [0, 10, 20, 40, 80, 160, 320, 640, 1280, 2560]
