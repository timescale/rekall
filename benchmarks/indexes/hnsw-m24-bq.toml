# pgvector HNSW M=24 over a binary-quantized EXPRESSION index
# (`(binary_quantize(v)::bit(768)) bit_hamming_ops`) -- pgvector's documented
# recommended binary-quantization setup. No materialized column / no table
# rewrite: the index is built directly on the expression, ~32x smaller than the
# full-precision graph, and the full `v` column stays in the table for other
# indexes (and the rerank stage) to use.
#
# Always reranked (per the pg-aiguide HNSW tuning guide): raw Hamming ranking
# alone has low recall, so this over-fetches a candidate pool by Hamming from
# the index and re-ranks it by full-precision cosine on `v`.
#
#   https://github.com/timescale/pg-aiguide/blob/main/skills/pgvector-semantic-search/SKILL.md
#
# Oversampling = 80x the final k (the guide's recommended starting point):
# k=10 -> rerank_pool=800 candidates, with hnsw.ef_search >= 800 so the scan
# actually returns the full pool. ef_search is swept >= 800 to trace the
# recall/QPS curve at fixed 80x oversampling (800 is the recommended point;
# higher ef_search improves candidate quality at more cost).
[[index]]
type = "pgvector-hnsw"
name = "hnsw-m24-bq"
table_parallel_workers = 32
[index.params]
m = 24
ef_construction = 200
encoding = "bit"

[[query]]
name = "hnsw-m24-bq-rerank"
index = "hnsw-m24-bq"
mode = "rerank"
[query.params]
# Fixed 80x oversampling: 800 candidates reranked for k=10.
rerank_pool = [800]
# Scan depth swept >= the 800-candidate pool; 800 is the guide's recipe.
"hnsw.ef_search" = [800, 1200, 1600, 2400]
