# pgvector HNSW M=24 over a binary-quantized expression index
# (`binary_quantize(v)::bit(768)` with `bit_hamming_ops`) — pgvector's
# documented recommended setup for binary quantization. No materialized
# column: the index is built directly on the expression, ~32x smaller than
# the full-precision graph. Same graph degree (m=24) and build effort
# (ef_construction=200) as hnsw-m24.toml, so comparing against it isolates
# the effect of binary quantization from the graph structure.
#
# The one index is searched two ways (many [[query]] → one index), each
# reported as its own series:
#   - bq-raw    : single-stage Hamming ranking. Fast but low recall —
#                 Hamming over sign bits is only a coarse angular proxy.
#   - bq-rerank : two-stage. Take the HNSW Hamming candidates, then re-rank
#                 them by full-precision cosine on `v`.
[[index]]
type = "pgvector-hnsw"
name = "hnsw-m24-bq"
[index.params]
m = 24
ef_construction = 200
encoding = "bit"

# Single-stage Hamming query — the raw recall/QPS curve over ef_search.
[[query]]
name = "hnsw-m24-bq-raw"
index = "hnsw-m24-bq"
mode = "raw"
[query.params]
"hnsw.ef_search" = [10, 20, 40, 80, 120, 200, 400, 800, 1000]

# Two-stage rerank query. `hnsw.ef_search` is the recall/speed knob — the HNSW
# scan returns at most ef_search candidates regardless of the inner LIMIT — so
# sweep it exactly like the raw query. `rerank_pool` is pinned ≥ max(ef_search)
# so every candidate the scan returns is re-ranked by full-precision cosine
# (no candidates discarded). This is the fair pgvector frontier: same scan
# cost as raw at each point, plus the rerank.
[[query]]
name = "hnsw-m24-bq-rerank"
index = "hnsw-m24-bq"
mode = "rerank"
[query.params]
"hnsw.ef_search" = [10, 20, 40, 80, 120, 200, 400, 800, 1000]
rerank_pool = [1000]
