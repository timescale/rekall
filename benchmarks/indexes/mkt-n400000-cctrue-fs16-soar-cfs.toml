# Meerkat: nlist=400000, centroid compression + FASTSCAN centroids, fs16, SOAR.
# Sized for cohere-100M via the ~256-vectors/list heuristic: 100M/256 ~= 390k
# -> 400000 (~250 vecs/list, the measured sweet zone; at 50M the sweet spot was
# n240k = 208/list, and n480k = 104/list only tied it as per-centroid training
# data thins out).
#
# The index.gucs below (mkt.centroid_error_scale=0, mkt.centroid_beam_scale=0.25)
# are the recall-neutral query optimizations and require the meerkat perf branch
# feat/cohere-50m-perf (not yet on main): error_scale and beam_scale GUCs, plus
# raised MKTANN_MAX_NLIST (>=400k) and max_nprobe (4096) ceilings.
[[index]]
type = "meerkat"
name = "mkt-n400000-cctrue-fs16-soar-cfs"
table_parallel_workers = 32
[index.params]
nlist = 400000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16
"mkt.centroid_error_scale" = 0
"mkt.centroid_beam_scale" = 0.25

[[search.sweep]]
index = "mkt-n400000-cctrue-fs16-soar-cfs"
[search.sweep.params]
"mkt.nprobe" = [160, 240, 320, 480, 640, 960, 1280]
