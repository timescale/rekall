# Meerkat optimized (cohere tuning): centroid compression + FASTSCAN centroids,
# fastscan-16, SOAR + boundary replication. nlist=24000 ~= 416 vecs/list at 10M
# -- the best 10M config measured so far (the top of the original 10M sweep).
# The suite pairs it with a finer arm (n40000) to test whether higher nlist is
# better, since the 10M sweep never went above n24000. Requires
# feat/cohere-50m-perf.
[[index]]
type = "meerkat"
name = "mkt-n24000-cctrue-fs16-soar-cfs"
table_parallel_workers = 32
[index.params]
nlist = 24000
centroid_compression = true
centroid_fastscan = true
fastscan = true
soar_lambda = 1.0
boundary_epsilon = 0.05
[index.gucs]
"mkt.fastscan_bits" = 16
"mkt.centroid_error_scale" = 0
"mkt.centroid_beam_scale" = 0.25

[[search.sweep]]
index = "mkt-n24000-cctrue-fs16-soar-cfs"
[search.sweep.params]
"mkt.nprobe" = [10, 20, 40, 80, 160, 320, 640, 1280, 2560]
