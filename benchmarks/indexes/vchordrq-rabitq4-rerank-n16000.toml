# VectorChord vchordrq with 4-bit RaBitQ + exact-distance rerank. lists=16000
# (VectorChord's own 10M sizing). residual_quantization is NOT supported with
# rabitq4 — set false explicitly (rekall defaults it true). Recall lost to
# 4-bit is recovered via the rerank pool; rerank_n=200 is a starting point,
# raise if recall plateaus. spherical centroids kept for cosine clustering.
[[index]]
type = "vchordrq-rabitq4"
name = "vchordrq-rabitq4-rerank-n16000"
[index.params]
lists = [16000]
residual_quantization = false
spherical_centroids = true
build_threads = 16
rerank_n = 200

[[search.sweep]]
index = "vchordrq-rabitq4-rerank-n16000"
[search.sweep.params]
"vchordrq.probes" = ["5", "10", "20", "40", "80", "160", "320", "640", "1280", "2560"]
