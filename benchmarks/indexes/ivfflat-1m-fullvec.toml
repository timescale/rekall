# pgvector IVFFlat over the bare full-precision v column (vector_*_ops) for the cohere 1m suites.
# lists = 1000 -- at 1M rows pgvector's two sizing rules coincide
# (rows/1000 == sqrt(rows) == 1000).
# ivfflat.probes swept for the recall/QPS curve; raw-mode recall is bounded
# by the probed lists' contents (no ef-style depth knob). The ladder stops
# at 320: each probe scans ~rows/lists tuples, so deeper points cost hours
# of sweep time for QPS below practical interest (probes = lists would be
# a full-table scan per query).
[[index]]
type = "pgvector-ivfflat"
name = "ivfflat-1m-fullvec"
table_parallel_workers = 32
[index.params]
lists = 1000

[[search.sweep]]
index = "ivfflat-1m-fullvec"
[search.sweep.params]
"ivfflat.probes" = [1, 2, 5, 10, 20, 40, 80, 160, 320]
