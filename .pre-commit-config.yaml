# commit-msg alongside pre-commit, so `pre-commit install` wires the
# Conventional Commits check below as well as the file hooks.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Rust hooks (format, lint, check)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        require_serial: true

      - id: cargo-check
        name: cargo check
        entry: cargo check --all-targets
        language: system
        types: [rust]
        pass_filenames: false
        require_serial: true

      - id: cargo-test
        name: cargo test (unit)
        entry: cargo test -p rekall-lib --lib
        language: system
        types: [rust]
        pass_filenames: false
        require_serial: true

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Commit messages follow Conventional Commits. The type list is the
  # tool's default plus this repo's own bench and infra; listing types
  # replaces the default set, so all of them are spelled out. CI runs the
  # same hook over every commit of a pull request
  # (scripts/ci/check-commit-messages.sh).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - bench
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - infra
          - perf
          - refactor
          - revert
          - style
          - test
