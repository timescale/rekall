<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Index build time (heap prewarmed before each build)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  html,body{height:100%;margin:0;background:white;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  #header{flex:0 0 auto;padding:10px 16px 6px;text-align:center}
  #header .title{font-size:20px;font-weight:600;color:#222}
  #header .meta{margin-top:4px;font-size:12px;color:#555}
  #plot{flex:1 1 auto;min-height:0;width:100%}
</style></head><body>
<div id="header"><div class="title">Index build time (heap prewarmed before each build)</div><div class="meta">“Pinecone vs PRISM”<br>cohere-10m  |  2026-10-29  |  r8i.4xlarge, Intel(R) Xeon(R) 6975P-C, 16 vCPU, 124 GB<br>PG 18.6  |  shared_buffers=32 GB  |  work_mem=1 GB  |  max_parallel_maintenance_workers=8  |  pg_vectorsearch 0.2.0-dev (5f71e47), pgvector 0.8.7</div></div>
<div id="plot"></div>
<script>
var trace = { type:"bar", x:["prism-defaults", "pg_pinecone-defaults"], y:[993.1479548, 375.72443759], text:["2690 MB", "1247 MB"],
  textposition:"outside", cliponaxis:false, hovertext:["993.1s · 2690 MB · 8 workers", "375.7s · 1247 MB · 0 workers"],
  hovertemplate:"<b>%{x}</b><br>%{hovertext}<extra></extra>",
  marker:{color:"rgb(31,119,180)"} };
var layout = { margin:{t:20},
  yaxis:{ title:"Build time (seconds)", gridcolor:"#eeeeee", rangemode:"tozero" },
  xaxis:{ automargin:true, tickangle:-40 },
  plot_bgcolor:"white", paper_bgcolor:"white" };
Plotly.newPlot("plot",[trace],layout,{responsive:true});
</script></body></html>
