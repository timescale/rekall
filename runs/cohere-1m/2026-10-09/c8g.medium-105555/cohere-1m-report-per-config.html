<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Recall vs QPS (per config)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: white; }
  body { display: flex; flex-direction: column; font-family: sans-serif; }
  #header { flex: 0 0 auto; padding: 10px 16px 6px; text-align: center; }
  #header .title { font-size: 20px; font-weight: 600; color: #222; }

</style>
</head>
<body>
<div id="header"><div class="title">Recall vs QPS (per config)</div><div class="meta">“recall-floor 1.2 coefficient verification (PR #252 @ 4e5b29b)”<br>cohere-1m  |  2026-10-09  |  c8g.medium, unknown, 1 vCPU, 2 GB<br>PG 18.6  |  shared_buffers=512 MB  |  work_mem=16 MB  |  max_parallel_maintenance_workers=1  |  pgvector 0.8.7</div></div>
<div id="plot"></div>
<script>
var traces = [{

                customdata: [0.87054999999998, 0.965419999999979, 0.9953599999999942, 0.998649999999998, 0.9995499999999992],

var layout = {
  margin: { t: 20 },

Plotly.newPlot("plot", traces, layout, { responsive: true });
function showAll() { var d = document.getElementById("plot"); d.data.forEach(function(_,i) { Plotly.restyle(d, {visible: true}, [i]); }); }

<div style="position:fixed;top:8px;right:8px;z-index:999;font-family:sans-serif;font-size:13px">

</div>
</body>
</html>
