<!DOCTYPE html>
<html>
<head>

<style>

  body { display: flex; flex-direction: column; font-family: sans-serif; }

</head>
<body>

<div style="position:fixed;top:8px;right:8px;z-index:999;font-family:sans-serif;font-size:13px">

</body>
</html>
