<!DOCTYPE html>
<html>
<head>

<style>

</head>
<body>
<div id="header"><div class="title">Recall vs QPS (Pareto)</div><div class="meta">“smallest-practical probe: 100M on 128GB/8 workers”<br>cohere-100m  |  2026-07-07  |  r8i.4xlarge, Intel(R) Xeon(R) 6975P-C, 16 vCPU, 124 GB<br>PG 18.4  |  shared_buffers=32 GB  |  work_mem=1 GB  |  max_parallel_maintenance_workers=8  |  meerkat 0.1.0 (78c22ca), pgvector 0.8.4</div></div>
<div id="plot"></div>
<script>
var traces = [{

<div style="position:fixed;top:8px;right:8px;z-index:999;font-family:sans-serif;font-size:13px">

</body>
</html>
